        <p>${z?.available ? `<b>${pct(z.findings.earlyExtremeRate, 0)}</b> of sessions set their high or low before
          09:30 CT. The opening 30 minutes runs <b>${(z.zones[0]?.concentration ?? 0).toFixed(1)}× chance</b> of holding
          an extreme; the midday trough runs ${(Math.min(...z.zones.map((x) => x.concentration))).toFixed(1)}×.` : ''}
          ${ev.length ? `<br><b>High-impact releases:</b> ${ev.map((e) => `${e.title} ${e.ctTime ?? ct(e.etTime)} CT (${e.window.replace('-', ' ')})`).join('; ')}.` : ''}</p>
      </section>

      <section>
        <h2>7 · Recent sessions</h2>
        <p class="prov">Last ${d.rows.length} RTH sessions. NR7 sessions are highlighted; the outlined slot on
          the right is where the next session's range is projected to land.</p>
        ${barChart(d.rows, d.projection)}
        <table style="margin-top:14px">
          <thead><tr><th style="text-align:left">Date</th><th>Open</th><th>High</th><th>Low</th><th>Close</th>
            <th>Range</th><th>CLV</th><th style="text-align:left">Flags</th></tr></thead>
          <tbody>${d.rows.slice().reverse().slice(0, 10).map((r) => {
            const f2 = [];
            if (r.insideDay === true) f2.push('ID');
            if (r.nr4 === true) f2.push('NR4');
            if (r.nr7 === true) f2.push('NR7');
            if (r.nr20 === true) f2.push('NR20');
            if (r.twoBarNr20 === true) f2.push('2BarNR20');
            return `<tr><td>${r.date}</td><td>${n1(r.open)}</td><td>${n1(r.high)}</td><td>${n1(r.low)}</td>
              <td>${n1(r.close)}</td><td>${n1(r.range)}</td>
              <td>${r.clv == null ? '—' : Math.round(r.clv * 100) + '%'}</td>
              <td style="text-align:left">${f2.join(' / ') || '—'}</td></tr>`;
          }).join('')}</tbody>
        </table>
      </section>

      <section>
        <h2>8 · Where extremes form</h2>
        <p class="prov">${z?.sessions?.toLocaleString() ?? '—'} sessions, ${z?.sampleSource ?? ''}.
          Above the line are session highs, below are lows.</p>
        ${z?.available ? zoneProfileSvg(z) : ''}
      </section>

      <section>
        <h2>9 · Evidence</h2>
        <table class="briefkv">
          <tr><td>Next-session range</td><td><b>${q ? q.medianRangeMultiple.toFixed(2) : '—'}×</b> the setup day</td>
              <td class="prov">median after ${q?.label ?? '—'}, n=${q?.n ?? '—'}; baseline ${st?.baseline?.medianRangeMultiple?.toFixed(2) ?? '—'}×</td></tr>
          <tr><td>Projected range</td><td><b>${n0(pj.median)}</b> pts</td>
              <td class="prov">${n0(pj.p25)}–${n0(pj.p75)} middle half</td></tr>
          <tr><td>Expected move</td><td><b>±${n0(d.expectedMove?.points ?? 0)}</b> pts</td>
              <td class="prov">VXN ${d.expectedMove?.iv?.toFixed(2) ?? '—'}, ${ordinal(Math.round((d.expectedMove?.ivPercentile ?? 0) * 100))} pct of 5y</td></tr>
          <tr><td>Beats 20-session avg</td><td><b>${pct(q?.expansionRate ?? 0, 0)}</b></td>
              <td class="prov">vs ${pct(st?.baseline?.expansionRate ?? 0, 0)} baseline — below it</td></tr>
          <tr><td>Direction</td><td><b>no edge</b></td>
              <td class="prov">no cohort clears 2 s.e. of the ${pct(st?.baseline?.upCloseRate ?? 0, 0)} drift</td></tr>
        </table>
      </section>

      <section>
        <h2>10 · What would make this wrong</h2>
        <ul>
          <li>The bracket is provisional until the 8:30 CT open exists. Every level here moves with it.</li>
          <li>Expansion is measured <b>relative to the setup day</b>. A ${q ? q.medianRangeMultiple.toFixed(2) : '—'}× session
            off a ${n0(d.last.range)}-pt day is still <b>below</b> the 20-session average more often than not.</li>
          <li>Direction is not predicted by anything in ${st?.sampleSessions?.toLocaleString() ?? '—'} sessions. Both orders rest.</li>
          <li>Gamma levels come from an undocumented MenthorQ endpoint; 0DTE levels expire nightly.</li>
          <li>Statistics use NAS100 as a stand-in for NQ — correlation 0.9996 on RTH range, NR flags 36/36,
            but it is a proxy. Live prices are real NQ.</li>
        </ul>
      </section>
    </article>`;
}

function render(d) {
  if (d.error) {
    app.innerHTML = `<div class="source err"><span class="icon">✕</span><div><b>No data</b><span class="why">${d.error}</span></div></div>`;
    $('#sub').textContent = '';
    return;
  }

  const L = d.last, rows = d.rows;
  const rth = d.source === 'RTH';
  const g = setupGrade(d);

  $('#sub').textContent = `${d.meta.instrument ?? ''} · ${d.sessionCount} sessions · last ${L.date}`;

  const orb = d.orb.available
    ? `<div class="orb">
         <div class="leg"><div class="k">Buy stop</div><div class="v">${n1(d.orb.buyStop)}</div></div>
         <div class="leg"><div class="k">Sell stop</div><div class="v">${n1(d.orb.sellStop)}</div></div>
       </div>
       <p class="hint" style="margin:14px 0 0">Bracketed off ${n1(d.orb.reference)} — ${d.orb.referenceLabel}</p>`
    : `<p class="hint" style="margin:0">Unavailable — ${d.orb.reason}</p>`;

  app.innerHTML = `
    ${sourceBanner(d)}
    ${touchBanner(d)}

    <div class="verdict">
      <div class="grade grade-${g.level}">
        <span class="g-icon" aria-hidden="true">${g.icon}</span>
        <span class="g-label">${g.label}</span>
      </div>
      <div class="text">${d.verdict}</div>
      <p class="synth">${g.detail}</p>
      <p class="synth">${synthesis(d)}</p>
      <div class="chips">
        ${chip('Inside day', L.insideDay)}
        ${chip('NR4', L.nr4)}
        ${chip('NR7', L.nr7)}
        ${chip('NR20', L.nr20)}
        ${chip('ID/NR4', L.idNr4)}
        ${chip('2BarNR20', L.twoBarNr20)}
      </div>
    </div>

    <div class="panel">
      <h2>${d.orb.live ? "Today's bracket" : "Monday's bracket"}</h2>
      <p class="hint">${d.orb.available ? `Reference ± Stretch — ${d.orb.referenceLabel}` : ''}</p>
      <div class="orb-head">
        ${d.orb.available ? `
          <div class="stop buy"><span class="k">Buy stop</span><span class="v">${n1(d.orb.buyStop)}</span></div>
          <div class="stop sell"><span class="k">Sell stop</span><span class="v">${n1(d.orb.sellStop)}</span></div>
          <div class="stop hero-stretch"><span class="k">Stretch</span><span class="v">${n1(d.nextStretch)}</span>
            <span class="sub">$${(d.nextStretch * 2).toFixed(2)} / MNQ</span></div>
        ` : `<p class="hint">Unavailable — ${d.orb.reason}</p>`}
      </div>
      ${priceMap(d)}
      ${orderPlan(d)}
      ${d.stretchVsEm ? `<p class="hint" style="margin:10px 0 0">
        The bracket sits <b>${Math.round(d.stretchVsEm.ratio * 100)}%</b> of the way to a 1σ move —
        ${d.stretchVsEm.ratio < 0.5
          ? 'well inside the expected range, so a touch is likely and carries little information on its own.'
          : d.stretchVsEm.ratio < 0.85
            ? 'mid-range; a touch is a moderate signal.'
            : 'near the edge of the expected range; a touch is a genuine outlier move.'}
        ±1σ means about 68% of sessions finish inside it — not a boundary.</p>` : ''}
    </div>

    <div class="grid">
      <div class="tile">
        <div class="label">Projected range — next session</div>
        ${d.projection.available
          ? `<div class="value">${n0(d.projection.median)}</div>
             <div class="note">${n0(d.projection.p25)}–${n0(d.projection.p75)} middle half · ${d.projection.medianMultiple.toFixed(2)}× after ${d.projection.cohort}</div>`
          : `<div class="value na">unavailable</div><div class="note">${d.projection.reason}</div>`}
      </div>
      <div class="tile">
        <div class="label">Expected move — 1 session</div>
        ${d.expectedMove.available
          ? `<div class="value">${n0(d.expectedMove.points)}</div>
             <div class="note">±${d.expectedMove.pct.toFixed(2)}% · VXN ${d.expectedMove.iv.toFixed(2)}${
               d.expectedMove.ivPercentile != null
                 ? ` · ${ordinal(Math.round(d.expectedMove.ivPercentile * 100))} pct of 5y, ${d.expectedMove.ivRegime}`
                 : ''}</div>`
          : `<div class="value na">unavailable</div><div class="note">${d.expectedMove.reason}</div>`}
      </div>
      <div class="tile">
        <div class="label">${L.date.slice(5)} range vs 20-session avg</div>
        <div class="value">${L.rangePctOf20d == null ? '—' : Math.round(L.rangePctOf20d) + '%'}</div>
        <div class="note">${n0(L.range)} pts · closed ${L.clv == null ? '—' : Math.round(L.clv * 100) + '%'} of range${

      </div>
      <div class="tile">
        <div class="label">Consecutive NR7</div>
        <div class="value">${d.nr7Streak}</div>
        <div class="note">${nr7StreakNote(d)}</div>

    ${tradeBreakdown(d)}

    ${auctionPanel(d)}

    ${oiPanel(d)}

    ${expiryPanel(d)}

    ${eventsPanel(d.calendar)}

    <div class="panel">
      <h2>Range compression — last ${rows.length} sessions</h2>

        <span><i style="background:var(--bar-plain)"></i>Other sessions</span>
        <span><i class="ghost"></i>Projected next</span>

      ${barChart(rows, d.projection)}

          <th>Date</th><th>Open</th><th>High</th><th>Low</th><th>Close</th>
          <th>Range</th><th>Stretch</th><th>CLV</th><th style="text-align:left">Flags</th>
        </tr></thead>
        <tbody>${rows.slice().reverse().map(r => {
          const f = [];
          if (r.insideDay === true) f.push('ID');
          if (r.nr4 === true) f.push('NR4');
          if (r.nr7 === true) f.push('NR7');
          if (r.nr20 === true) f.push('NR20');
          if (r.twoBarNr20 === true) f.push('2BarNR20');
          return `<tr>
            <td>${r.date}</td><td>${n1(r.open)}</td><td>${n1(r.high)}</td><td>${n1(r.low)}</td><td>${n1(r.close)}</td>
            <td>${n1(r.range)}</td><td class="${r.stretch == null ? 'muted' : ''}">${n1(r.stretch)}</td>
            <td>${r.clv == null ? '—' : Math.round(r.clv * 100) + '%'}</td>
            <td style="text-align:left" class="flagcell">${f.join(' / ') || '<span class="muted">—</span>'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </details>`;

  wireTooltip(rows);
  wireProfile(d.meta.zones?.profile ?? []);
}

/** Hover layer for the intraday profile. Hit areas span the full column height. */
function wireProfile(prof) {
  const svg = $('#profile');
  if (!svg) return;
  svg.querySelectorAll('.hitzone').forEach((el) => {
    el.style.cursor = 'crosshair';
    el.addEventListener('mousemove', (e) => {
      const p = prof[+el.dataset.b];
      if (!p) return;
      tip.innerHTML = `<b>${ctRange(p.from, p.to)} CT</b>` +
        `Highs formed here: ${pct(p.highPct, 1)}<br>Lows formed here: ${pct(p.lowPct, 1)}<br>` +
        `<span style="color:var(--text-muted)">${p.concentration.toFixed(2)}× vs an even spread</span>`;
      tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 244) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
  });
}

function wireTooltip(rows) {
  const svg = $('#chart');
  if (!svg) return;
  svg.querySelectorAll('path').forEach((p) => {
    p.style.cursor = 'crosshair';
    p.addEventListener('mousemove', (e) => {
      const r = rows[+p.dataset.i];
      const f = [];
      if (r.insideDay === true) f.push('ID');
      if (r.nr4 === true) f.push('NR4');
      if (r.nr7 === true) f.push('NR7');
      if (r.twoBarNr20 === true) f.push('2BarNR20');
      tip.innerHTML = `<b>${r.date}</b>Range ${n1(r.range)} pts<br>O ${n1(r.open)} · C ${n1(r.close)}<br>${f.length ? f.join(' / ') : 'no contraction flag'}`;
      tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 244) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
    });
    p.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
  });
}

// ---- Bracket alerts -------------------------------------------------------
//
// These are CONFIRMATIONS, not triggers. The underlying data is 1-minute bars
// polled every 5 seconds, so a touch is reported up to about a minute after it
// happens. Useful for "did it go?", useless as an execution signal — your
// platform's own alert is the one to trade off.

const FIRED_KEY = 'oceans-crabel-fired';
const fired = new Set(JSON.parse(localStorage.getItem(FIRED_KEY) || '[]'));

function remember(key) {
  fired.add(key);
  localStorage.setItem(FIRED_KEY, JSON.stringify([...fired].slice(-40)));
}

function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, tag: title }); } catch { /* non-fatal */ }
}

function checkTouches(d) {
  const t = d.touch;
  if (!t || !d.orb?.available) return;

  for (const [side, hit, level] of [
    ['buy', t.buy, d.orb.buyStop],
    ['sell', t.sell, d.orb.sellStop],
  ]) {
    const key = `${t.sessionDate}:${side}`;
    if (!hit || fired.has(key)) continue;
    remember(key);
    notify(
      `${side === 'buy' ? 'Buy' : 'Sell'} bracket touched — ${n1(level)}`,
      `${t.sessionDate} session reached the ${side} stop as of the ${t.asOf} bar.`
    );
  }
}

function touchBanner(d) {
  const t = d.touch;
  if (!t) return '';
  if (!t.buy && !t.sell) {
    return `<div class="touch idle"><span class="icon">○</span>
      <div>Neither bracket touched yet — session running, checked to the ${t.asOf} bar.</div></div>`;
  }
  const which = t.buy && t.sell ? 'Both brackets' : t.buy ? 'Buy bracket' : 'Sell bracket';
  return `<div class="touch hit"><span class="icon">●</span>
    <div><b>${which} touched</b> — as of the ${t.asOf} bar.
    ${t.buy && t.sell ? 'Both sides went, so the first fill was the trade and the other was noise.' : ''}</div></div>`;
}

async function enableAlerts() {
  const btn = $('#alertbtn');
  if (!('Notification' in window)) { btn.textContent = 'alerts unsupported'; btn.disabled = true; return; }
  const p = await Notification.requestPermission();
  paintAlertBtn(p);
  if (p === 'granted') notify("Ocean's Crabel", 'Bracket alerts are on for this browser.');
}

function paintAlertBtn(perm) {
  const btn = $('#alertbtn');
  if (!btn) return;
  const p = perm ?? (('Notification' in window) ? Notification.permission : 'unsupported');
  btn.textContent = p === 'granted' ? 'alerts on' : p === 'denied' ? 'alerts blocked' : 'enable alerts';
  btn.classList.toggle('on', p === 'granted');
  btn.disabled = p === 'denied' || p === 'unsupported';
}

// Re-rendering identical HTML every 5 seconds throws away scroll position and
// any open <details>. Only touch the DOM when the payload actually changed.
let lastPayload = null;

async function tick() {
  try {
    const raw = await (await fetch('/api/data', { cache: 'no-store' })).text();
    $('#updated').textContent = 'updated ' + new Date().toLocaleTimeString('en-US', { hour12: false });

    if (raw === lastPayload) return;
    lastPayload = raw;

    const d = JSON.parse(raw);

    // This tab was served from one build; the server is now on another. Say so
    // rather than letting an old dashboard look current.
    if (d.buildTime && window.__BUILD__ && d.buildTime !== window.__BUILD__) {
      const bar = $('#stalebar');
      bar.hidden = false;
      bar.className = 'stalebar';
      bar.innerHTML = `<span class="icon">↻</span>
        <div><b>This page is out of date.</b> The dashboard has been rebuilt since you loaded it —
        reload to pick up the changes.</div>
        <button type="button" id="reloadbtn">Reload</button>`;
      $('#reloadbtn').addEventListener('click', () => location.reload());
    }

    lastData = d;
    tickClock();
    if (!d.error) checkTouches(d);
    render(d);
    renderTrade(d.error ? null : d);
    renderWatch(d.error ? null : d);
    renderBrief(d.error ? null : d);
    renderCheat(d.error ? null : d);
    applyTab();
    $('#dot').className = 'dot' + (d.error ? ' stale' : '');
  } catch (e) {
    $('#updated').textContent = 'connection lost';
    $('#dot').className = 'dot stale';
  }
}

// The clocks tick on their own so they stay live without re-rendering the page.
let lastData = null;
function tickClock() {
  const c = sessionClock(lastData);
  const el = $('#clock');
  el.textContent = c.text;
  el.style.color = c.live ? 'var(--status-good)' : '';

  const strip = $('#zonestrip');
  if (strip) strip.innerHTML = zoneStripHtml(lastData?.meta?.zones);
}

$('#alertbtn').addEventListener('click', enableAlerts);
paintAlertBtn();

// The PDF is rendered server-side by headless Edge and takes a few seconds, so
// the button says so rather than appearing to do nothing.
$('#pdfbtn').addEventListener('click', () => {
  const b = $('#pdfbtn');
  const label = b.textContent;
  b.classList.add('busy');
  b.textContent = 'rendering…';
  setTimeout(() => { b.classList.remove('busy'); b.textContent = label; }, 12000);
});

// ?print=1 is how the PDF renderer asks for the brief alone.
if (new URLSearchParams(location.search).get('print') === '1') {
  activeTab = 'brief';
  document.documentElement.dataset.theme = 'light';
}

applyTab();
tick();
tickClock();
setInterval(tick, 5000);
setInterval(tickClock, 1000);   // countdowns are only useful if they actually count
</script>
</body>
</html>
