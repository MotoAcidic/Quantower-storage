        </tbody>
      </table>
      <p class="hint" style="margin:8px 0 0">Median rather than mean — a handful of violent expansions drags
        the average well above the typical session (${q ? `${q.label}: mean ${q.avgRangeMultiple.toFixed(2)}× vs median ${q.medianRangeMultiple.toFixed(2)}×` : ''}).</p>
    </details>

    <details style="margin-top:10px">
      <summary>Where the session opens — Crabel's second axis</summary>
      ${opening}
    </details>

    <p class="hint" style="margin:16px 0 0">${st.triggerRateNote}</p>
  </div>`;
}

  cheat.innerHTML = `

Stretch = mean( d(1) … d(10) )${has ? `

current Stretch = ${S(st)} pts  =  ${money(st * MNQ_POINT)} per MNQ contract` : ''}</code>

        target</b>: a quarter of occurrences came in under the low end and a quarter ran past the high end.</p>
      <p>Its practical use is sanity-checking a stop. If your stop distance is small relative to the
        projected range, expect to be taken out by ordinary movement rather than by being wrong.</p>
    </div>

    <div class="panel">
      <h2>Expected move</h2>
      <p>Derived from VXN, the Nasdaq-100 volatility index:</p>
      <code class="formula">EM(1 session) = spot × (VXN ÷ 100) ÷ √252${em?.available ? `

  = ${S(em.spot ?? 0, 0)} × (${em.iv.toFixed(2)} ÷ 100) ÷ 15.87
  = ${S(em.points)} pts   (±${em.pct.toFixed(2)}%)` : ''}</code>
      <p>This is <b>one standard deviation</b> — roughly 68% of sessions finish inside it. It is not a
        boundary and price trades outside it about one session in three. VXN measures index vol,
        not NQ futures vol; they track closely but are different instruments.</p>
      <p>Its use here is as a yardstick: the Stretch as a fraction of the expected move tells you
        whether your bracket is a routine touch or a genuine outlier.</p>
    </div>

    <div class="two">
      <div class="panel">
        <h2>MNQ contract</h2>
        <table class="def">
          <tbody>
            <tr><td>Point value</td><td>$2.00</td></tr>
            <tr><td>Tick</td><td>0.25 pt = $0.50</td></tr>
            <tr><td>RTH</td><td>08:30 – 15:00 CT <span class="muted">(09:30 – 16:00 ET)</span></td></tr>
            <tr><td>Globex</td><td>17:00 – 16:00 CT next day <span class="muted">(18:00 – 17:00 ET)</span></td></tr>
            <tr><td>vs E-mini NQ</td><td>MNQ is 1/10 the size ($20/pt)</td></tr>
          </tbody>
        </table>
      </div>
      <div class="panel">
        <h2>Caveats worth keeping</h2>
        <p>Crabel published this in 1990 and later said the edge decayed sharply afterwards — he
          reportedly tried to buy back copies. The <em>framework</em> holds; the 1990 hit rates do not.
          Refit on current data, which is what the base rates panel is for.</p>
        <p>Everything here assumes the RTH session. Anything computed off Globex bars is labelled as
          such, and the Stretch in particular is not tradable in that mode.</p>
      </div>
    </div>`;
}

/**
 * "Expansion overdue" was wrong. The base rates say a contraction expands
 * relative to its own setup day while still producing a session that is
 * BELOW the 20-day average more often than an ordinary day does. Both halves
 * have to be said, or the card promises a big session the data doesn't support.
 */
function nr7StreakNote(d) {
  if (!d.nr7Streak) return 'no streak';

  const st = d.stats;
  const q = st?.available ? (st.current.insufficient ? st.nearestUsable : st.current) : null;
  if (!q || !st.baseline) return 'contracting';

  const belowBaseline = q.expansionRate < st.baseline.expansionRate;
  return belowBaseline
    ? 'expands off the setup day, but still a below-average session'
    : 'expands off the setup day and beats the average session';
}

/**
 * The trade tab: every variable on one price axis, plus the mechanics.
 *
 * Price runs vertically because that is how a ladder is read. Bands (expected
 * move, projection, prior range) sit left of centre; gamma levels label to the
 * right; the two orders cut across everything. Nothing here is new data — it is
 * the same numbers as the Live read, arranged for the moment of acting.
 */
function priceLadder(d, side) {
  const orb = d.orb, em = d.expectedMove, pj = d.projection, L = d.last, g = d.gamma;
  if (!orb?.available) return '<p class="hint">No bracket to plot.</p>';

  // Role depends on direction: the buy stop is the entry on a long and the stop
  // loss on a short. Colour follows the role, never the price level, so the two
  // views cannot be confused for one another.
  const long = side === 'long';
  const entryPx = long ? orb.buyStop : orb.sellStop;
  const stopPx = long ? orb.sellStop : orb.buyStop;
  const targets = (long ? g?.above : g?.below) ?? [];

  const ref = orb.reference;
  const pts = [orb.buyStop, orb.sellStop, ref, L.high, L.low];
  if (em?.available) pts.push(em.upper, em.lower);
  if (pj?.available) pts.push(ref + pj.median / 2, ref - pj.median / 2, ref + pj.p75 / 2, ref - pj.p75 / 2);
  const gl = g?.available ? g.map.filter((l) => Math.abs(l.value - ref) <= (pj?.p75 ?? 500)) : [];
  gl.forEach((l) => pts.push(l.value));

  const lo = Math.min(...pts), hi = Math.max(...pts);
  const pad = (hi - lo) * 0.05 || 1;
  const TOP = 26, H = 620, BOT = H - 26;
  const y = (v) => BOT - ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * (BOT - TOP);

  const W = 1000, AXIS = 74, COL = 150, GAMMA_X = 470;

  // Price gridlines on clean increments.
  const span = (hi + pad) - (lo - pad);
  const step = span > 900 ? 200 : span > 450 ? 100 : 50;
  const ticks = [];
  for (let p = Math.ceil((lo - pad) / step) * step; p <= hi + pad; p += step) {
    ticks.push(`<line x1="${AXIS}" y1="${y(p)}" x2="${W - 8}" y2="${y(p)}" stroke="var(--gridline)" stroke-width="1"/>
      <text class="axis" x="${AXIS - 8}" y="${y(p) + 3.5}" text-anchor="end">${n0(p)}</text>`);
  }

  // Vertical bands: each is a price interval, drawn as a column.
  const band = (x, w, a, b, fill, op, label) => `
    <rect x="${x}" y="${y(b)}" width="${w}" height="${Math.max(2, y(a) - y(b))}" rx="4" fill="${fill}" opacity="${op}"/>
    <text class="axis" x="${x + w / 2}" y="${TOP - 10}" text-anchor="middle" style="font-size:10.5px">${label}</text>`;

  // The sigma band and the projected range are not peers: ±1σ is a two-sided
  // span around the reference (2 × the figure quoted), while the projection is
  // a high-to-low range. Drawn adjacent without saying so they read as agreeing
  // when they differ about 2:1, so the label carries the span.
  // Labels are short so three columns 78px apart cannot collide, and each states
  // its own span — the sigma band is two-sided and would otherwise read as a
  // peer of the projected range when it is roughly twice it.
  let bands = '';
  if (em?.available) bands += band(AXIS + 22, 62, em.lower, em.upper, 'var(--bar-plain)', 0.3,
    `±1σ ${n0(em.points * 2)}`);
  if (pj?.available) {
    bands += band(AXIS + 100, 62, ref - pj.p75 / 2, ref + pj.p75 / 2, 'var(--bar-plain)', 0.22, '');
    bands += band(AXIS + 100, 62, ref - pj.median / 2, ref + pj.median / 2, 'var(--bar-plain)', 0.55,
      `proj ${n0(pj.median)}`);
  }
  bands += band(AXIS + 178, 62, L.low, L.high, 'var(--bar-plain)', 0.7, `${L.date.slice(5)} ${n0(L.range)}`);

  // Gamma levels, right side, de-collided so labels never overlap.
  const majors = /Gamma Wall|Call Resistance|Put Support|HVL|1D M/i;
  const sorted = [...gl].sort((a, b) => b.value - a.value);
  const merged = [];
  for (const l of sorted) {
    const prev = merged.at(-1);
    if (prev && Math.abs(y(prev.value) - y(l.value)) < 13) prev.names.push(l.name);
    else merged.push({ value: l.value, names: [l.name] });
  }
  // A level is a target only if it lies beyond the entry in the trade's direction.
  const isTarget = (v) => targets.some((t) => Math.abs(t.value - v) < 0.01);

  const gamma = merged.map((l) => {
    const major = l.names.some((n) => majors.test(n));
    const tgt = isTarget(l.value);
    const stroke = tgt ? 'var(--trade-target)' : 'var(--text-muted)';
    const op = tgt ? 0.75 : major ? 0.55 : 0.25;
    return `<line x1="${GAMMA_X}" y1="${y(l.value)}" x2="${W - 250}" y2="${y(l.value)}"
              stroke="${stroke}" stroke-width="${tgt ? 1.75 : major ? 1.5 : 1}" opacity="${op}"/>
      <text class="axis" x="${W - 244}" y="${y(l.value) + 3.5}"
            style="font-size:${major || tgt ? 10.5 : 9.5}px;${tgt ? 'fill:var(--trade-target)' : major ? 'fill:var(--text-secondary)' : ''}">${tgt ? '▸ ' : ''}${l.names.slice(0, 3).join(' / ')}</text>`;
  }).join('');

  // Colour carries the role; the word on the tag carries it too, so neither is
  // load-bearing alone.
  const order = (v, role, color) => `
    <line x1="${AXIS}" y1="${y(v)}" x2="${W - 250}" y2="${y(v)}" stroke="${color}" stroke-width="2.5"/>
    <rect x="${AXIS + 2}" y="${y(v) - 17}" width="150" height="15" rx="3" fill="${color}"/>
    <text x="${AXIS + 8}" y="${y(v) - 5.5}" style="font-size:10.5px;font-weight:700;fill:#fff">${role} ${n1(v)}</text>`;

  // Shade the risk band between entry and stop — the money actually at hazard.
  const riskBand = `<rect x="${AXIS}" y="${y(Math.max(entryPx, stopPx))}" width="${W - 250 - AXIS}"
      height="${Math.abs(y(stopPx) - y(entryPx))}" fill="var(--trade-stop)" opacity="0.09"/>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img"
       aria-label="Price ladder: entry, stop loss, targets, bands and gamma levels for the ${side} trade">
    ${ticks.join('')}
    ${riskBand}
    ${bands}
    ${gamma}
    <line x1="${AXIS}" y1="${y(ref)}" x2="${W - 250}" y2="${y(ref)}" stroke="var(--baseline)" stroke-width="1"/>
    <text class="axis" x="${AXIS + 4}" y="${y(ref) + 12}" style="font-size:10px">reference ${n1(ref)}</text>
    ${order(stopPx, 'EXIT IF WRONG', 'var(--trade-stop)')}
    ${order(entryPx, long ? 'BUY ABOVE' : 'SELL BELOW', 'var(--trade-entry)')}
  </svg>`;
}

/**
 * The day roadmap: one left-to-right time axis from the European open to the
 * bell, carrying the session zones, their measured concentration, and every
 * scheduled release.
 *
 * Colour is ordinal, not decorative. Zones shade by how often the day's extreme
 * forms in them; events shade by impact. Both scales carry their number or word
 * beside the mark so neither depends on hue.
 */
function dayRoadmap(d) {
  const zones = d.meta?.zones;
  const cal = d.calendar;
  const prof = zones?.profile ?? [];
  const T0 = toMin('02:00'), T1 = toMin('16:00');

  const W = 1000, LEFT = 46, RIGHT = W - 8;
  // Five stacked lanes sharing one time axis. Deliberately not a Pareto chart:
  // the histogram and the cumulative curve get their own lanes rather than two
  // y-scales on one plot, which would invent a relationship between them.
  const EV_H = 58;                       // events
  const ZONE_Y = EV_H, ZONE_H = 26;      // named windows
  const HIST_Y = ZONE_Y + ZONE_H + 12, HIST_H = 74;   // extremes per 30 min
  const CUM_Y = HIST_Y + HIST_H + 22, CUM_H = 62;     // cumulative share
  const AXIS_Y = CUM_Y + CUM_H + 6;
  const ACT_Y = AXIS_Y + 24, ACT_H = 26;
  const H = ACT_Y + ACT_H + 8;
  const x = (m) => LEFT + ((Math.min(Math.max(m, T0), T1) - T0) / (T1 - T0)) * (RIGHT - LEFT);

  const conc = new Map((zones?.zones ?? []).map((z) => [z.key, z.concentration]));

  // Every window on the clock, including the overnight ones we do not measure.
  const LANES = [
    { key: 'euPos', label: 'Europe positioning', from: '02:00', to: '05:00' },
    { key: 'euCont', label: 'Europe continuation', from: '05:00', to: '07:00' },
    { key: 'premkt', label: 'NY premarket', from: '07:00', to: '09:30' },
    { key: 'nyOpen', label: 'NY open', short: 'open', from: '09:30', to: '10:00' },
    { key: 'amRev', label: 'AM reversal', short: 'AM rev', from: '10:00', to: '11:00' },
    { key: 'lateAm', label: 'Late morning', from: '11:00', to: '12:00' },
    { key: 'lunch', label: 'Lunch', from: '12:00', to: '13:00' },
    { key: 'pm', label: 'PM trend', from: '13:00', to: '15:00' },
    { key: 'close', label: 'Close', from: '15:00', to: '16:00' },
  ];

  const bands = LANES.map((z) => {
    const xa = x(toMin(z.from)), xb = x(toMin(z.to)), w = xb - xa;
    const c = conc.get(z.key);
    // Opacity tracks concentration: the hot windows are visibly heavier.
    const op = c == null ? 0.12 : Math.max(0.12, Math.min(0.8, c / 4.2));
    const hot = c != null && c >= 1.5;
    const fs = w < 96 ? 9 : 10;
    const fits = (s, size = fs) => s.length * size * 0.56 < w - 6;

    // The 09:30 window is thirty minutes wide and the most important band on the
    // chart. Rather than truncate it, its label moves below the axis on a leader.
    const inside = fits(z.label) ? z.label : fits(z.short ?? z.label) ? (z.short ?? z.label) : null;
    const below = inside ? '' : `
      <line x1="${xa + w / 2}" y1="${ZONE_Y + ZONE_H}" x2="${xa + w / 2}" y2="${AXIS_Y + 26}"
            stroke="var(--bar-flag)" stroke-width="1" opacity="0.5"/>
      <text class="axis" x="${xa + w / 2}" y="${AXIS_Y + 38}" text-anchor="middle"
            style="font-size:10px;font-weight:700;fill:var(--bar-flag)">${z.label}${c != null ? ` ${c.toFixed(1)}×` : ''}</text>`;

    return `
      <rect x="${xa + 1}" y="${ZONE_Y}" width="${Math.max(2, w - 2)}" height="${ZONE_H}" rx="4"
            fill="${hot ? 'var(--bar-flag)' : 'var(--bar-plain)'}" opacity="${op}"/>
      <title>${z.label} · ${ctRange(z.from, z.to)} CT${c != null ? ` · ${c.toFixed(2)}× extreme concentration` : ' · not measured'}</title>
      ${inside ? `<text class="axis" x="${xa + w / 2}" y="${ZONE_Y + 14}" text-anchor="middle" style="font-size:${fs}px">${inside}</text>
        ${c != null ? `<text class="axis" x="${xa + w / 2}" y="${ZONE_Y + 28}" text-anchor="middle"
          style="font-size:10.5px;font-weight:700;${hot ? 'fill:var(--bar-flag)' : ''}">${c.toFixed(1)}×</text>` : ''}` : ''}
      ${below}`;
  }).join('');

  // Hour ticks along the bottom. Positioned by ET minutes, labelled in CT.
  const hours = [];
  for (let m = T0; m <= T1; m += 60) {
    hours.push(`<line x1="${x(m)}" y1="${AXIS_Y}" x2="${x(m)}" y2="${AXIS_Y + 5}" stroke="var(--baseline)" stroke-width="1"/>
      <text class="axis" x="${x(m)}" y="${AXIS_Y + 18}" text-anchor="middle" style="font-size:9.5px">${hhmmCt(m)}</text>`);
  }

  // --- Lane 3: where the day's extremes actually form, per 30 minutes --------
  const peak = Math.max(...prof.map((p) => (p.highPct + p.lowPct) / 2), 0.02);
  const hist = prof.map((p) => {
    const xa = x(toMin(p.from)), xb = x(toMin(p.to));
    const share = (p.highPct + p.lowPct) / 2;
    const h = (share / peak) * HIST_H;
    const hot = p.concentration >= 2;
    return `<rect x="${xa + 1}" y="${HIST_Y + HIST_H - h}" width="${Math.max(2, xb - xa - 2)}" height="${Math.max(1, h)}"
              rx="3" fill="${hot ? 'var(--bar-flag)' : 'var(--bar-plain)'}" opacity="${hot ? 0.9 : 0.6}">
              <title>${ctRange(p.from, p.to)} CT · ${pct(share, 1)} of all session extremes · ${p.concentration.toFixed(2)}× chance</title></rect>
            ${hot ? `<text class="axis" x="${(xa + xb) / 2}" y="${HIST_Y + HIST_H - h - 5}" text-anchor="middle"
              style="font-size:10px;font-weight:700;fill:var(--bar-flag)">${pct(share, 0)}</text>` : ''}`;
  }).join('');

  // --- Lane 4: cumulative share of extremes already set ---------------------
  let run = 0;
  const cum = prof.map((p) => { run += (p.highPct + p.lowPct) / 2; return { m: toMin(p.to), v: run }; });
  const cumPts = [{ m: toMin('09:30'), v: 0 }, ...cum]
    .map((c) => `${x(c.m)},${CUM_Y + CUM_H - c.v * CUM_H}`).join(' ');
  const half = cum.find((c) => c.v >= 0.5);
  const cumGrid = [0, 0.5, 1].map((v) => `
    <line x1="${LEFT}" y1="${CUM_Y + CUM_H - v * CUM_H}" x2="${RIGHT}" y2="${CUM_Y + CUM_H - v * CUM_H}"
          stroke="var(--gridline)" stroke-width="1"/>
    <text class="axis" x="${LEFT - 6}" y="${CUM_Y + CUM_H - v * CUM_H + 3.5}" text-anchor="end" style="font-size:9px">${v * 100}%</text>`).join('');
  const cumLine = `<polyline points="${cumPts}" fill="none" stroke="var(--bar-flag)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${half ? `<line x1="${x(half.m)}" y1="${CUM_Y}" x2="${x(half.m)}" y2="${CUM_Y + CUM_H}"
        stroke="var(--text-muted)" stroke-width="1" opacity="0.6"/>
      <text class="axis" x="${x(half.m) + 5}" y="${CUM_Y + 11}" style="font-size:9.5px">half the day's extremes are in by ${hhmmCt(half.m)}</text>` : ''}`;

  // --- Lane 5: what you are doing, derived from the measured concentration ---
  const ACTIONS = [
    { from: '02:00', to: '09:30', text: 'watch — bracket not valid until the 8:30 CT open', tone: 'idle' },
    { from: '09:30', to: '10:00', text: 'orders live · first signal only', tone: 'act' },
    { from: '10:00', to: '11:00', text: 'manage', tone: 'manage' },
    { from: '11:00', to: '15:00', text: 'low expansion — the day is mostly decided', tone: 'idle' },
    { from: '15:00', to: '16:00', text: 'close out', tone: 'manage' },
  ];
  const actions = ACTIONS.map((a) => {
    const xa = x(toMin(a.from)), xb = x(toMin(a.to)), w = xb - xa;
    const fill = a.tone === 'act' ? 'var(--trade-entry)' : a.tone === 'manage' ? 'var(--bar-plain)' : 'transparent';
    const op = a.tone === 'act' ? 0.85 : a.tone === 'manage' ? 0.35 : 0;
    const fits = a.text.length * 9 * 0.55 < w - 8;
    return `<rect x="${xa + 1}" y="${ACT_Y}" width="${Math.max(2, w - 2)}" height="${ACT_H}" rx="4"
              fill="${fill}" opacity="${op}" ${a.tone === 'idle' ? 'stroke="var(--border)"' : ''}/>
            <title>${ctRange(a.from, a.to)} CT · ${a.text}</title>
            ${fits ? `<text class="axis" x="${xa + w / 2}" y="${ACT_Y + 17}" text-anchor="middle"
              style="font-size:9.5px;${a.tone === 'act' ? 'fill:#fff;font-weight:700' : ''}">${a.text}</text>` : ''}`;
  }).join('');

  // Events, stacked into rows so labels never collide.
  const IMPACT = {
    High: { color: 'var(--status-warning)', w: 2.5, op: 1 },
    Medium: { color: 'var(--text-secondary)', w: 1.5, op: 0.8 },
    Low: { color: 'var(--text-muted)', w: 1, op: 0.5 },
    Holiday: { color: 'var(--text-muted)', w: 1, op: 0.5 },
  };
  const evs = (cal?.upcoming ?? [])
    .map((e) => ({ ...e, m: toMin(e.etTime) }))
    .filter((e) => e.m >= T0 && e.m <= T1)
    .sort((a, b) => a.m - b.m);

  const rows = [];
  const marks = evs.map((e) => {
    const st = IMPACT[e.impact] ?? IMPACT.Low;
    const label = `${e.ctTime ?? ct(e.etTime)} ${e.title}`;
    const wpx = label.length * 5.1;
    let row = 0;
    while (rows[row] != null && rows[row] > x(e.m) - 4) row++;
    rows[row] = x(e.m) + wpx;
    const yy = EV_H - 14 - row * 14;

    // High-impact releases get a blast radius: the minutes either side where the
    // tape is reacting to the print rather than to the pattern.
    const blast = e.impact === 'High'
      ? `<rect x="${x(e.m - 5)}" y="${ZONE_Y}" width="${x(e.m + 15) - x(e.m - 5)}" height="${CUM_Y + CUM_H - ZONE_Y}"
             fill="var(--status-warning)" opacity="0.09"/>`
      : '';

    return `${blast}
      <line x1="${x(e.m)}" y1="${yy}" x2="${x(e.m)}" y2="${ZONE_Y + ZONE_H}" stroke="${st.color}"
            stroke-width="${st.w}" opacity="${st.op}"/>
      <circle cx="${x(e.m)}" cy="${yy}" r="3" fill="${st.color}" opacity="${st.op}"/>
      <text class="axis" x="${x(e.m) + 6}" y="${yy + 3.5}"
            style="font-size:10px;${e.impact === 'High' ? 'fill:var(--status-warning);font-weight:700' : ''}">${label}</text>`;
  }).join('');

  const nowM = etNowMinutes();
  const nowIn = nowM >= T0 && nowM <= T1 && !zoneSchedule().closed;
  const nowMark = nowIn ? `
    <line x1="${x(nowM)}" y1="6" x2="${x(nowM)}" y2="${ACT_Y + ACT_H}" stroke="var(--status-good)" stroke-width="2"/>
    <text class="axis" x="${x(nowM) + 5}" y="14" style="font-size:10px;fill:var(--status-good);font-weight:700">now</text>` : '';

  const laneLabel = (y, t) => `<text class="axis" x="${LEFT - 6}" y="${y}" text-anchor="end"
      style="font-size:9px;fill:var(--text-muted)">${t}</text>`;

  const note = !cal?.available
    ? `Calendar unavailable — ${cal?.reason ?? 'no source'}.`
    : evs.length
      ? `${evs.length} scheduled release${evs.length === 1 ? '' : 's'} in this window. High-impact releases are amber.`
      : cal.exhausted
        ? 'No releases left in this week\'s feed — ForexFactory publishes a current-week file only, so it empties out until the new one lands. This is a feed limit, not a clear calendar.'
        : 'No releases fall inside 01:00–15:00 CT.';

  return `<svg viewBox="0 0 ${W} ${H}" role="img"
       aria-label="Day roadmap: releases, session windows, where extremes form, cumulative share, and what to do, on one time axis">
    ${marks}
    ${bands}
    ${laneLabel(HIST_Y + 10, 'extremes')}
    ${laneLabel(HIST_Y + 21, 'per 30m')}
    <text class="axis" x="${(LEFT + x(toMin('09:30'))) / 2}" y="${HIST_Y + HIST_H / 2}" text-anchor="middle"
          style="font-size:9.5px;fill:var(--text-muted)">overnight not measured — these are RTH extremes</text>
    ${hist}
    ${cumGrid}${cumLine}
    ${laneLabel(CUM_Y - 4, 'set by now')}
    <line x1="${LEFT}" y1="${AXIS_Y}" x2="${RIGHT}" y2="${AXIS_Y}" stroke="var(--baseline)" stroke-width="1"/>
    ${hours.join('')}
    ${laneLabel(ACT_Y + 17, 'do')}
    ${actions}
    ${nowMark}
  </svg>
  <p class="hint" style="margin:2px 0 0">${note}</p>`;
}

/**
 * How good is the geometry of one side of this trade?
 *
 * This rates the SHAPE of the trade, never its direction. Direction has no
 * measured edge in 2,637 sessions, so a confidence score that implied one would
 * be inventing information. What it does measure is answerable: how much of the
 * projected day you must capture to make 1R, how much clear ground there is
 * before the first level, and how many levels sit in the way.
 */
function sideConfidence(d, dir) {
  const orb = d.orb, g = d.gamma, pj = d.projection;
  if (!orb?.available || !pj?.available) return null;

  const risk = 2 * d.nextStretch;
  const entry = dir === 'long' ? orb.buyStop : orb.sellStop;
  const levels = ((dir === 'long' ? g?.above : g?.below) ?? []);

  // The single most decision-relevant ratio: 1R expressed as a share of the
  // range the session is projected to cover at all.
  const costOfR = risk / pj.median;

  const air = dir === 'long' ? g?.airLong : g?.airShort;
  const airShare = air != null ? air / pj.median : null;

  // Where does the first target paying 1R sit, and what is in front of it?
  const oneR = levels.find((l) => Math.abs(l.value - entry) / risk >= 1);
  const obstructions = oneR
    ? levels.filter((l) => Math.abs(l.value - entry) < Math.abs(oneR.value - entry)).length
    : levels.length;

  let score = 100;
  const reasons = [];

  if (costOfR >= 0.45) { score -= 40; reasons.push(`1R needs ${pct(costOfR, 0)} of the projected range`); }
  else if (costOfR >= 0.3) { score -= 20; reasons.push(`1R needs ${pct(costOfR, 0)} of the projected range`); }
  else reasons.push(`1R is only ${pct(costOfR, 0)} of the projected range`);

  if (!oneR) { score -= 25; reasons.push('no level pays 1R inside the projection'); }
  else if (obstructions >= 3) { score -= 15; reasons.push(`${obstructions} levels before the first 1R target`); }
  else if (obstructions > 0) { score -= 7; reasons.push(`${obstructions} level${obstructions === 1 ? '' : 's'} before 1R`); }

  if (airShare != null && airShare < 0.08) { score -= 20; reasons.push(`only ${n0(air)} pts of clear ground`); }
  else if (airShare != null && airShare < 0.15) { score -= 10; reasons.push(`${n0(air)} pts of clear ground`); }
  else if (air != null) reasons.push(`${n0(air)} pts of clear ground`);

  score = Math.max(0, Math.min(100, score));
  const band = score >= 65 ? 'workable' : score >= 40 ? 'marginal' : 'poor';

  return { score, band, costOfR, air, airShare, obstructions, oneR, reasons };
}

/** Targets expressed in R, where R is the bracket-to-bracket stop. */
function targetTable(d, dir) {
  const g = d.gamma, orb = d.orb;
  if (!g?.available) return '<p class="hint" style="margin:0">No levels to target.</p>';

  const entry = dir === 'long' ? orb.buyStop : orb.sellStop;
  const risk = 2 * d.nextStretch;                 // stop at the opposite bracket
  const list = (dir === 'long' ? g.above : g.below).slice(0, 5);
  if (!list.length) return '<p class="hint" style="margin:0">No levels within the projection on this side.</p>';

  return `<table class="tgt">
    <thead><tr><th style="text-align:left">Target</th><th>Price</th><th>Points</th><th>R</th><th>$ / contract</th></tr></thead>
    <tbody>${list.map((l) => {
      const move = Math.abs(l.value - entry);
      const r = move / risk;
      // 1D Min / 1D Max are MenthorQ's expected-move band, not dealer
      // positioning. They are still price levels worth targeting, but the panel
      // is titled "gamma positioning" so they are marked rather than implied.
      const volBand = (l.families ?? []).includes('vol-band');
      return `<tr class="${r >= 1 ? 'tp-hit' : ''}">
        <td style="text-align:left"><span class="tp-dot"></span>${l.names.slice(0, 2).join(' / ')}${
          volBand ? ' <span class="muted" style="font-size:10.5px">vol band, not gamma</span>' : ''}</td>
        <td>${n1(l.value)}</td>
        <td>${n0(move)}</td>
        <td class="${r >= 1 ? 'r-good' : 'muted'}">${r.toFixed(2)}R</td>
        <td>$${(move * MNQ_PT).toFixed(0)}</td></tr>`;
    }).join('')}</tbody>
  </table>`;
}

/**
 * Open interest we computed, next to levels we were handed.
 *
 * CBOE publishes every listed strike with its open interest and gamma, free.
 * MenthorQ sells levels derived from the same raw material. Showing both is the
 * point: where an independently computed wall lands on a level someone else sold
 * you, that level is real. Where they disagree, one of them is wrong and you now
 * know to distrust it. Averaging the two would erase exactly that.
 */
function oiPanel(d) {
  const oi = d.openInterest;
  if (!oi?.available) {
    return `<div class="panel"><h2>Open interest — CBOE</h2>
      <p class="hint" style="margin:0">Unavailable — ${oi?.reason ?? 'not pulled'}.</p></div>`;
  }

  const gx = (v) => `${v >= 0 ? '+' : '−'}${Math.abs(v / 1e9).toFixed(2)}B`;
  const spot = oi.spot;

  // QQQ carries roughly ten times the open interest of the index book, so it is
  // the primary read; NDX is shown beside it as the native-strike cross-check.
  const books = [
    oi.qqq && !oi.qqq.unavailable ? { ...oi.qqq, title: 'QQQ book', lead: true } : null,
    oi.ndx ? { ...oi.ndx, title: 'NDX book' } : null,
  ].filter(Boolean);

  const row = (b) => {
    const dist = (p) => `${p > spot ? '+' : '−'}${n0(Math.abs(p - spot))}`;
    const wall = (w) => !w ? '—'
      : `${n0(w.price)} <span class="muted">${dist(w.price)}</span>${
          w.atMoney ? '<br><span class="muted" style="font-size:10.5px">at the money — not a target</span>' : ''}`;
    return `<tr>
      <td style="text-align:left"><b>${b.title}</b>${b.lead ? ' <span class="muted">primary</span>' : ''}</td>
      <td>${b.totalOi.toLocaleString()}</td>
      <td>${b.flip == null ? '<span class="muted">no crossing</span>'
        : `${n0(b.flip)} <span class="muted">${dist(b.flip)}</span>`}</td>
      <td>${wall(b.callWall)}</td>
      <td>${wall(b.putWall)}</td>
    </tr>`;
  };

  // Which side of the flip price sits on is the regime, and it is what the flip
  // number is actually for. Both books have to agree before it is stated as one.
  const sides = books.map((b) => b.belowFlip).filter((v) => v != null);
  const regime = sides.length && sides.every((v) => v === true) ? 'below'
    : sides.length && sides.every((v) => v === false) ? 'above' : 'split';

  // Where the two independent sources land on the same price, within a tick band
  // that is meaningful for NQ rather than an arbitrary tolerance.
  const TOL = 25;
  const mine = books.flatMap((b) => [
    b.callWall && { price: b.callWall.price, what: `${b.title} call wall` },
    b.putWall && { price: b.putWall.price, what: `${b.title} put wall` },
    b.flip != null && { price: b.flip, what: `${b.title} gamma flip` },
  ].filter(Boolean));
  const theirs = (d.gamma?.available ? [...(d.gamma.above ?? []), ...(d.gamma.below ?? [])] : []);
  // Every cross-source pair, nearest first. Reporting only the ones that clear
  // the bar makes a near-miss indistinguishable from nothing in the book, and
  // the distance is the informative part — so the closest pair is always shown
  // and the threshold only decides what it gets called.
  const pairs = mine.flatMap((m) => theirs.map((t) => ({
    ...m, their: t.names?.[0] ?? 'level', theirPrice: t.value, gap: Math.abs(t.value - m.price),
  }))).sort((a, b) => a.gap - b.gap);
  const agree = pairs.filter((p) => p.gap <= TOL);
  const closest = pairs[0] ?? null;

  const flips = books.map((b) => b.flip).filter((f) => f != null);
  const flipSpread = flips.length === 2 ? Math.abs(flips[0] - flips[1]) : null;

  return `<div class="panel">
    <h2>Open interest — computed from CBOE</h2>
    <p class="hint">Every listed strike with its open interest and gamma, pulled once a day and kept.
      This is the raw positioning, not someone's read of it — and it is the same material MenthorQ's
      levels are built from, so the two can be checked against each other.</p>

    <table>
      <thead><tr><th style="text-align:left">Book</th><th>Open interest</th><th>Gamma flip</th>
        <th>Call wall above</th><th>Put wall below</th></tr></thead>
      <tbody>${books.map(row).join('')}</tbody>
    </table>

    ${regime === 'split' ? `<p class="hint" style="margin:10px 0 0">
      <b>The two books put price on opposite sides of their flip.</b> There is no single regime to state — one
      says hedging amplifies from here, the other says it damps. Neither reading earns any weight today.</p>`
    : regime === 'below' ? `<p class="hint" style="margin:10px 0 0">
      <b>Price is below the flip on both books — the negative-gamma side.</b> Hedging there runs with the move
      rather than against it: dealers sell into weakness and buy into strength, which is the condition that
      lets a range expand instead of getting pinned. It says nothing about direction, and it is a regime read
      off an end-of-day book, not a live one.</p>`
    : `<p class="hint" style="margin:10px 0 0">
      <b>Price is above the flip on both books — the positive-gamma side.</b> Hedging leans against the move,
      which damps range. That is the condition breakouts fail in, and it is worth knowing before sizing an
      expansion trade.</p>`}

    ${flipSpread != null && flipSpread > 200 ? `<p class="hint" style="margin:10px 0 0">
      <b>The two books disagree on the flip by ${n0(flipSpread)} points.</b> The ETF and index books are
      hedged by different desks and do not have to agree. Treat the flip as a wide zone today, not a line.</p>` : ''}

    ${agree.length ? `<p class="hint" style="margin:10px 0 0">
      <b>${agree.length} independent confirmation${agree.length === 1 ? '' : 's'}:</b>
      ${agree.map((a) => `${a.what} at ${n0(a.price)} sits on MenthorQ's ${a.their} (${n1(a.theirPrice)}),
        ${n0(a.gap)} point${Math.round(a.gap) === 1 ? '' : 's'} apart`).join('; ')}.
      Two sources computed separately landing within ${TOL} points is the strongest read on this page.</p>`
    : closest ? `<p class="hint" style="margin:10px 0 0">
      <b>Nothing clears the ${TOL}-point bar.</b> The closest pair is ${closest.what} at ${n0(closest.price)}
      against MenthorQ's ${closest.their} (${n1(closest.theirPrice)}) — <b>${n0(closest.gap)} points</b> apart.
      ${closest.gap <= TOL * 1.5
        ? 'That is a near miss rather than a contradiction: the two sources are looking at the same area but do '
          + 'not pin the same price, so treat it as a zone and not a line.'
        : 'The two sources are pointing at genuinely different prices today, so neither set of levels deserves '
          + 'the weight a confirmed one would get.'}</p>`
    : ''}

    ${(() => {
      const dec = (oi.qqq && !oi.qqq.unavailable ? oi.qqq.decay : oi.ndx?.decay);
      if (!dec?.buckets?.length) return '';
      const near = dec.buckets.filter((b) => b.bucket === '0dte' || b.bucket === '1d')
        .reduce((a, b) => a + b.shareOfOi, 0);
      return `
      <h3 style="font-size:12.5px;margin:18px 0 6px">Delta decay — what expires, and when</h3>
      <p class="hint">Options that finish out of the money bleed their delta to zero, and the hedge behind
        that delta has to unwind. The unwind is mechanical and its timing is known in advance — which makes
        it the one genuinely scheduled flow on this page.</p>
      <table>
        <thead><tr><th style="text-align:left">Expires</th><th>Open interest</th><th>Share of live book</th>
          <th>Net delta</th></tr></thead>
        <tbody>${dec.buckets.map((b) => `<tr>
          <td style="text-align:left">${b.label}</td>
          <td>${b.oi.toLocaleString()}</td>
          <td class="${b.shareOfOi > 0.1 ? 'sig' : ''}">${pct(b.shareOfOi, 1)}</td>
          <td>${(b.netDelta >= 0 ? '+' : '−') + Math.abs(b.netDelta / 1e6).toFixed(0)}M</td></tr>`).join('')}</tbody>
      </table>
      <p class="hint" style="margin:8px 0 0">${near > 0.12
        ? `<b>${pct(near, 0)} of the live book expires within a day.</b> That is a large scheduled unwind. It says
           when hedging flow arrives, not which way it pushes — that depends on where price sits relative to the
           strikes, which the walls above describe.`
        : `<b>${pct(near, 0)} of the live book expires within a day</b> — a small near-dated tail, so there is no
           large scheduled unwind pending.`}</p>
      ${dec.expiredOi > 0 ? `<p class="hint" style="margin:6px 0 0">${dec.expiredOi.toLocaleString()} contracts
        in the file have already expired and are excluded — their hedges unwound before this snapshot.</p>` : ''}
      <p class="prov" style="margin:6px 0 0">Net delta is exposure in underlying terms under the same
        long-calls / short-puts convention as the gamma figures. True charm needs a pricing model and an
        implied-vol surface; this measures the quantity exposed to decay, not the rate of it.</p>`;
    })()}

    ${(() => {
      const c = oi.correlation;
      if (!c || c.cor1m == null) return '';
      const row = (label, v, sub) => `<tr><td style="text-align:left">${label}</td>
        <td><b>${v == null ? '—' : v.toFixed(2)}</b></td>
        <td style="text-align:left" class="muted">${sub}</td></tr>`;
      return `
      <h3 style="font-size:12.5px;margin:18px 0 6px">Implied correlation — the dispersion regime</h3>
      <table>
        <tbody>
          ${row('COR1M', c.cor1m, 'What the option market prices for co-movement over the next month')}
          ${row('COR3M', c.cor3m, 'Same, three months out')}
          ${row('VIX1D', c.vix1d, 'One-day S&P implied volatility')}
          ${row('VXN', c.vxn, 'Nasdaq-100 implied volatility — the one the expected move uses')}
        </tbody>
      </table>
      <p class="hint" style="margin:8px 0 0">${c.inverted
        ? '<b>One-month correlation is above three-month.</b> The market is pricing more co-movement near '
          + 'term than far — stocks moving together is what a shock looks like, and index range tends to '
          + 'come with it.'
        : '<b>One-month correlation sits below three-month.</b> Near-term dispersion: the index is damped '
          + 'relative to the stocks inside it, because their moves partly cancel. An index breakout has to '
          + 'fight that, which is a reason a trigger can be touched and go nowhere.'}</p>
      <p class="prov" style="margin:6px 0 0">${c.note}</p>`;
    })()}

    ${oi.qqq?.note ? `<p class="hint" style="margin:8px 0 0">${oi.qqq.note}</p>` : ''}
    <p class="prov" style="margin:8px 0 0">${oi.source} · snapshot ${oi.date}${
      oi.stale ? ` · <b>stale by ${oi.ageDays} day${oi.ageDays === 1 ? '' : 's'}</b> — ${oi.staleReason}` : ''}.
      ${oi.caveats.join(' ')}</p>
  </div>`;
}

/**
 * Prior-session value area, drawn as the profile it actually is.
 *
 * The horizontal bars are time spent at each price. The shaded band is the 70%
 * value area and the marked line is the point of control. The bracket levels are
 * drawn on the same price scale, because the only question worth asking here is
 * whether a trigger fires into value or away from it — a breakout into the
 * middle of yesterday's agreed price is not a breakout.
 */
function auctionPanel(d) {
  const a = d.meta?.auction;
  if (!a?.available) {
    return `<div class="panel"><h2>Value area — prior session</h2>
      <p class="hint" style="margin:0">Unavailable — ${a?.reason ?? 'no intraday bars'}.</p></div>`;
  }

  const p = a.prior, orb = d.orb;
  const W = 1000, H = 300, PAD_L = 70, PAD_R = 210, PAD_T = 16, PAD_B = 28;
  const lo = Math.min(p.low, orb?.available ? orb.sellStop : p.low) - p.step;
  const hi = Math.max(p.high, orb?.available ? orb.buyStop : p.high) + p.step;
  const y = (v) => PAD_T + ((hi - v) / (hi - lo)) * (H - PAD_T - PAD_B);
  const peak = Math.max(...p.buckets.map((b) => b.tpo), 1);
  const barW = (t) => (t / peak) * (W - PAD_L - PAD_R);
  const rowH = Math.max(2, (H - PAD_T - PAD_B) / ((hi - lo) / p.step) - 1);

  const bars = p.buckets.map((b) => `
    <rect x="${PAD_L}" y="${y(b.price) - rowH / 2}" width="${Math.max(1, barW(b.tpo))}" height="${rowH}"
          fill="${b.isPoc ? 'var(--bar-flag)' : b.inValue ? 'var(--bar-plain)' : 'var(--text-muted)'}"
          opacity="${b.isPoc ? 0.95 : b.inValue ? 0.55 : 0.22}">
      <title>${n1(b.price)} · ${b.tpo} TPO${b.isPoc ? ' · point of control' : b.inValue ? ' · inside value' : ' · outside value'}</title>
    </rect>`).join('');

  // POC and a trigger can sit fifteen points apart, which is ten pixels here —
  // close enough that the two labels print on top of each other. The line stays
  // at its true price; only the text is nudged, and a leader connects the two so
  // a shifted label can never be read as a shifted level.
  const placed = [];
  const mark = (v, label, color, dash = '') => {
    if (v == null) return '';
    const ly = y(v);
    let ty = ly;
    while (placed.some((q) => Math.abs(q - ty) < 13)) ty += 13;
    placed.push(ty);
    const lead = Math.abs(ty - ly) > 1
      ? `<line x1="${W - PAD_R}" y1="${ly}" x2="${W - PAD_R + 7}" y2="${ty}" stroke="${color}"
               stroke-width="1" opacity="0.5"/>` : '';
    return `
    <line x1="${PAD_L}" y1="${ly}" x2="${W - PAD_R}" y2="${ly}" stroke="${color}"
          stroke-width="1.5" ${dash ? `stroke-dasharray="${dash}"` : ''}/>
    ${lead}
    <text x="${W - PAD_R + 10}" y="${ty + 4}" style="font-size:11px;font-weight:700;fill:${color}">${label} ${n1(v)}</text>`;
  };

  // Does the bracket fire into value or out of it? This is the whole reason the
  // two are drawn on one scale.
  const inValue = (v) => v != null && v >= p.val && v <= p.vah;
  const buyInside = orb?.available && inValue(orb.buyStop);
  const sellInside = orb?.available && inValue(orb.sellStop);

  return `<div class="panel">
    <h2>Value area — prior session</h2>
    <p class="hint">Time spent at each price on ${dayName(p.date)}, in ${p.step}-point buckets. The shaded
      band holds ${pct(p.valueAreaPct, 1)} of it. Bracket levels are on the same scale.</p>

    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Prior session time-at-price profile with value area, point of control and today's bracket levels">
      <rect x="${PAD_L}" y="${y(p.vah)}" width="${W - PAD_L - PAD_R}" height="${Math.max(1, y(p.val) - y(p.vah))}"
            fill="var(--bar-plain)" opacity="0.10"/>
      ${bars}
      ${mark(p.vah, 'VAH', 'var(--text-secondary)', '4 3')}
      ${mark(p.poc, 'POC', 'var(--bar-flag)')}
      ${mark(p.val, 'VAL', 'var(--text-secondary)', '4 3')}
      ${orb?.available ? mark(orb.buyStop, 'long trigger', 'var(--trade-entry)') : ''}
      ${orb?.available ? mark(orb.sellStop, 'short trigger', 'var(--trade-stop)') : ''}
    </svg>

    <table style="margin-top:10px">
      <thead><tr><th style="text-align:left">Level</th><th>Price</th><th style="text-align:left">What it is</th></tr></thead>
      <tbody>
        <tr><td style="text-align:left"><b>POC</b></td><td>${n1(p.poc)}</td>
          <td style="text-align:left">Most time spent here. The price the auction kept returning to.</td></tr>
        <tr><td style="text-align:left">VAH</td><td>${n1(p.vah)}</td>
          <td style="text-align:left">Top of value. Above it, yesterday's participants were not agreeing.</td></tr>
        <tr><td style="text-align:left">VAL</td><td>${n1(p.val)}</td>
          <td style="text-align:left">Bottom of value.</td></tr>
        ${p.ib ? `<tr><td style="text-align:left">Initial balance</td>
          <td>${n1(p.ib.low)} – ${n1(p.ib.high)}</td>
          <td style="text-align:left">First hour's range. The reference the rest of the session extends from.</td></tr>` : ''}
      </tbody>
    </table>

    ${buyInside || sellInside ? `<p class="hint" style="margin:10px 0 0">
      <b>${buyInside && sellInside ? 'Both triggers sit' : buyInside ? 'The long trigger sits' : 'The short trigger sits'}
      inside prior value.</b> A break into the band where yesterday's auction spent
      ${pct(p.valueAreaPct, 0)} of its time is firing into agreement, not away from it. Auction theory expects
      rotation there rather than continuation — which does not make the trigger invalid, but it does mean the
      cleaner side of this bracket is the one pointing out of value.</p>`
    : orb?.available ? `<p class="hint" style="margin:10px 0 0">Both triggers sit outside prior value — the
      bracket is positioned where yesterday's auction found no agreement, which is where an expansion has room
      to run rather than rotate.</p>` : ''}

    ${a.openVsValue ? `<p class="hint" style="margin:8px 0 0"><b>Today opened
      ${a.openVsValue.state} value${a.openVsValue.state !== 'inside' ? ` by ${n0(a.openVsValue.distanceToValue)} points` : ''}.</b>
      ${a.openVsValue.note}</p>` : ''}

    <p class="prov" style="margin:8px 0 0">${a.method}. ${a.caveats.join(' ')}</p>
  </div>`;
}

/**
 * The expiry calendar, and whether it actually does anything.
 *
 * Every date here is derived from exchange rules, so the calendar half never
 * fails. The measured half exists because "OPEX means volatility" is repeated
 * constantly and, on this sample, is backwards — expiry days are *quieter*. A
 * calendar that showed the dates without that number would be teaching the
 * wrong lesson, which is the one thing this page is built not to do.
 */
function expiryPanel(d) {
  const x = d.expiry;
  if (!x?.calendar?.length) return '';

  const next = x.calendar.filter((e) => !e.past).slice(0, 4);
  const eff = x.effect;

  const KIND = {
    'triple-witching': 'var(--status-warning)',
    'monthly-opex': 'var(--trade-entry)',
    'vix-expiry': 'var(--text-secondary)',
    'month-end': 'var(--text-muted)',
  };

  const cards = next.map((e) => `
    <div class="tile" style="border-left:3px solid ${KIND[e.kind] ?? 'var(--border)'}">
      <div class="label">${e.label}</div>
      <div class="value">${e.isToday ? 'today' : `${e.days}d`}</div>
      <div class="note">${dayName(e.date)}</div>
    </div>`).join('');

  // The bar used everywhere else on this page. Two sigma is suggestive; the
  // Harvey-Liu threshold for a claimed edge is three, and neither cohort reaches
  // it. Saying so here is the whole point of measuring.
  const verdict = (c) => {
    if (!c) return '<span class="muted">too few sessions</span>';
    const z = Math.abs(c.z);
    return z >= 3 ? '<b class="sig">clears the t≥3 bar</b>'
      : z >= 2 ? '<span class="muted">2σ, below the t≥3 bar</span>'
      : '<span class="muted">nothing</span>';
  };

  const rows = eff?.available ? [
    ['Expiry day', eff.cohorts.opexDay],
    ['Expiry week', eff.cohorts.opexWeek],
    ['Triple witching', eff.cohorts.quarterly],
    ['VIX expiry', eff.cohorts.vixExpiry],
  ].map(([label, c]) => `<tr>
      <td style="text-align:left">${label}</td>
      <td>${c ? c.n.toLocaleString() : '—'}</td>
      <td>${c ? c.meanRangePct.toFixed(1) + '%' : '—'}</td>
      <td class="${c && c.vsBaseline < 0 ? '' : 'muted'}">${c ? (c.vsBaseline >= 0 ? '+' : '') + c.vsBaseline.toFixed(1) + 'pp' : '—'}</td>
      <td>${c ? c.z.toFixed(2) : '—'}</td>
      <td style="text-align:left">${verdict(c)}</td>
    </tr>`).join('') : '';

  return `<div class="panel">
    <h2>Expiry calendar — and what it measures</h2>
    <p class="hint">Dates are derived from exchange rules, not fetched, so this cannot go stale.
      VIX settles 30 days before <em>next</em> month's third Friday, which is why it never lines up
      with equity expiry.</p>
    <div class="grid">${cards}</div>

    ${next.map((e) => `<p class="hint" style="margin:10px 0 0"><b>${e.label} · ${dayName(e.date)}.</b> ${e.note}</p>`).join('')}

    ${eff?.available ? `
      <h3 style="font-size:12.5px;margin:18px 0 6px">Does it actually change the range?</h3>
      <p class="hint">Range as a percentage of the trailing 20-session average, over
        ${eff.sessions.toLocaleString()} sessions. Baseline is
        <b>${eff.baseline.meanRangePct.toFixed(1)}%</b>.</p>
      <table>
        <thead><tr><th style="text-align:left">Cohort</th><th>n</th><th>Mean range</th>
          <th>vs baseline</th><th>z</th><th style="text-align:left">Verdict</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="hint" style="margin:10px 0 0"><b>This runs the opposite way to the folklore.</b>
        Expiry days and expiry weeks are <em>quieter</em> than an ordinary session, not wilder — which is
        what pinning predicts: open interest concentrated at nearby strikes pulls price toward them and
        damps the range. Triple witching, the day with the biggest reputation, measures nothing at all
        (n=${eff.cohorts.quarterly?.n ?? '—'}, z=${eff.cohorts.quarterly?.z.toFixed(2) ?? '—'}).</p>
      <p class="hint" style="margin:8px 0 0"><b>Do not size off this.</b> Two cohorts clear 2σ, neither
        clears the t≥3 bar this page uses to call something an edge, and four cohorts were tested — which
        raises the bar further. Treat it as a reason to expect compression on those days, not as a trade.</p>`
      : `<p class="hint" style="margin:10px 0 0">Effect not measured — ${eff?.reason ?? 'no deep history'}.</p>`}
  </div>`;
}

/**
 * The master chart: price on the vertical, the session clock on the horizontal.
 *
 * Levels are prices and events are times, so they only coexist on a 2-D plane.
 * Everything else has been stripped — no histogram, no cumulative curve, no
 * action lane. Those live on their own panels. What remains is the three things
 * you asked for and nothing competing with them:
 *
 *   the Crabel expectation   a horizontal band, the range the session should cover
 *   the levels              horizontal hairlines, labelled at the right edge
 *   the events              vertical lines at their scheduled minute
 */
function masterChart(d, side) {
  const orb = d.orb, pj = d.projection, em = d.expectedMove, g = d.gamma, L = d.last;
  if (!orb?.available || !pj?.available) return '<p class="hint">Not enough data to plot.</p>';

  const W = 1000, H = 470;
  const PAD_L = 58, PAD_R = 210, PAD_T = 34, PAD_B = 34;
  const T0 = toMin('09:30'), T1 = toMin('16:00');
  const ref = orb.reference;

  const long = side === 'long';
  const entryPx = long ? orb.buyStop : orb.sellStop;
  const exitPx = long ? orb.sellStop : orb.buyStop;
  const targets = (long ? g?.above : g?.below) ?? [];
  const isTarget = (v) => targets.some((t) => Math.abs(t.value - v) < 0.01);

  // Vertical extent: the Crabel range plus whatever levels fall near it. The
  // sigma band is deliberately allowed to overflow rather than dominate.
  const lvls = (g?.map ?? []).filter((l) => Math.abs(l.value - ref) <= pj.p75 * 0.75);
  const pts = [ref + pj.median / 2, ref - pj.median / 2, entryPx, exitPx, L.high, L.low,
    ...lvls.map((l) => l.value)];
  const lo = Math.min(...pts), hi = Math.max(...pts);
  const pad = (hi - lo) * 0.09;
  const y = (v) => PAD_T + (H - PAD_T - PAD_B) * (1 - (v - (lo - pad)) / ((hi + pad) - (lo - pad)));
  const x = (m) => PAD_L + ((Math.min(Math.max(m, T0), T1) - T0) / (T1 - T0)) * (W - PAD_L - PAD_R);

  // Price grid on a round step near span/5 — enough to read a price off, not
  // enough to become texture.
  const span = (hi + pad) - (lo - pad);
  const step = [10, 25, 50, 100, 150, 200, 250, 500, 1000]
    .reduce((best, s) => Math.abs(s - span / 5) < Math.abs(best - span / 5) ? s : best, 1000);
  const grid = [];
  for (let p = Math.ceil((lo - pad) / step) * step; p <= hi + pad; p += step) {
    grid.push(`<line x1="${PAD_L}" y1="${y(p)}" x2="${W - PAD_R}" y2="${y(p)}" stroke="var(--gridline)" stroke-width="1"/>
      <text class="axis" x="${PAD_L - 8}" y="${y(p) + 3.5}" text-anchor="end" style="font-size:10px">${n0(p)}</text>`);
  }

  const hours = [];
  for (let m = T0 + 30; m < T1; m += 60) {
    hours.push(`<text class="axis" x="${x(m)}" y="${H - 12}" text-anchor="middle" style="font-size:10px">${hhmmCt(m)}</text>`);
  }

  // 1 — the Crabel expectation.
  const crabel = `
    <rect x="${PAD_L}" y="${y(ref + pj.median / 2)}" width="${W - PAD_R - PAD_L}"
          height="${y(ref - pj.median / 2) - y(ref + pj.median / 2)}"
          fill="var(--bar-plain)" opacity="0.13"/>
    <text class="axis" x="${PAD_L + 8}" y="${y(ref + pj.median / 2) + 13}" style="font-size:10.5px">
      expected range ${n0(pj.median)} pts</text>`;

  // 2 — the levels. Only targets and the majors earn a label.
  const majors = /Gamma Wall|Call Resistance|Put Support|HVL/i;
  // Seed the label ledger with the two order lines. They are drawn last and must
  // never be overwritten, so level labels lay themselves out around them rather
  // than colliding — which is what put "Put Support" on top of "EXIT".
  const rows = [y(entryPx), y(exitPx)];
  const levels = lvls.map((l) => {
    const tgt = isTarget(l.value);
    const major = majors.test(l.name);
    const show = tgt || major;
    let label = '';
    if (show) {
      let yy = y(l.value);
      while (rows.some((r) => Math.abs(r - yy) < 12)) yy += 12;
      rows.push(yy);
      label = `<text class="axis" x="${W - PAD_R + 10}" y="${yy + 3.5}"
        style="font-size:10.5px;${tgt ? 'fill:var(--trade-target)' : 'fill:var(--text-secondary)'}">${tgt ? '▸ ' : ''}${l.name}</text>`;
    }
    return `<line x1="${PAD_L}" y1="${y(l.value)}" x2="${W - PAD_R}" y2="${y(l.value)}"
              stroke="${tgt ? 'var(--trade-target)' : 'var(--text-muted)'}"
              stroke-width="1" opacity="${tgt ? 0.65 : major ? 0.4 : 0.16}"/>${label}`;
  }).join('');

  // 3 — the events, on the clock.
  const evs = (d.calendar?.upcoming ?? [])
    .map((e) => ({ ...e, m: toMin(e.etTime) }))
    .filter((e) => e.m >= T0 && e.m <= T1);
  // Only high-impact releases are named. The rest are faint ticks — five
  // clustered labels around 10:00 became an unreadable pile, and the low-impact
  // ones were never going to change what you do. Their times stay on the
  // Evidence tab in full.
  const evLabelled = [];
  const events = evs.map((e) => {
    const high = e.impact === 'High';
    let label = '';
    if (high) {
      let lx = x(e.m) + 5;
      while (evLabelled.some((p) => Math.abs(p - lx) < 150)) lx += 14;
      evLabelled.push(lx);
      label = `<text class="axis" x="${x(e.m) + 5}" y="${PAD_T - 22 + (evLabelled.length - 1) * 12}"
        style="font-size:10px;fill:var(--status-warning);font-weight:700">${e.ctTime ?? ct(e.etTime)} ${e.title}</text>`;
    }
    return `<line x1="${x(e.m)}" y1="${PAD_T}" x2="${x(e.m)}" y2="${H - PAD_B}"
              stroke="${high ? 'var(--status-warning)' : 'var(--text-muted)'}"
              stroke-width="${high ? 1.5 : 1}" opacity="${high ? 0.55 : 0.14}"/>${label}`;
  }).join('');
  const quiet = evs.filter((e) => e.impact !== 'High').length;

  // The two lines you act on, drawn last so nothing crosses them.
  const orderLine = (v, label, color) => `
    <line x1="${PAD_L}" y1="${y(v)}" x2="${W - PAD_R}" y2="${y(v)}" stroke="${color}" stroke-width="2"/>
    <text x="${W - PAD_R + 10}" y="${y(v) + 4}" style="font-size:11px;font-weight:700;fill:${color}">${label} ${n1(v)}</text>`;

  const nowM = etNowMinutes();
  const nowIn = nowM >= T0 && nowM < T1 && !zoneSchedule().closed;

  return `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Session plan: expected range, levels and scheduled events on one price and time chart">
    ${grid.join('')}
    ${crabel}
    ${levels}
    ${events}
    <line x1="${PAD_L}" y1="${y(ref)}" x2="${W - PAD_R}" y2="${y(ref)}" stroke="var(--baseline)" stroke-width="1"/>
    ${orderLine(exitPx, long ? 'EXIT' : 'EXIT', 'var(--trade-stop)')}
    ${orderLine(entryPx, long ? 'BUY ABOVE' : 'SELL BELOW', 'var(--trade-entry)')}
    ${nowIn ? `<line x1="${x(nowM)}" y1="${PAD_T}" x2="${x(nowM)}" y2="${H - PAD_B}"
        stroke="var(--status-good)" stroke-width="2"/>` : ''}
    ${hours.join('')}
    <line x1="${PAD_L}" y1="${H - PAD_B}" x2="${W - PAD_R}" y2="${H - PAD_B}" stroke="var(--baseline)" stroke-width="1"/>
    ${quiet ? `<text class="axis" x="${W - PAD_R + 10}" y="${H - PAD_B - 2}"
      style="font-size:9.5px">${quiet} lower-impact<tspan x="${W - PAD_R + 10}" dy="11">release${quiet === 1 ? '' : 's'} unlabelled</tspan></text>` : ''}
  </svg>`;
}

/**
 * Measured expectancy of the trigger this bracket uses, against the alternatives
 * — net of friction, which every earlier version of this dashboard ignored.
 *
 * The bracket above is a fixed Crabel Stretch. On 2,636 sessions that construction
 * fails a t>=3 hurdle once realistic MNQ costs are applied, and conditioning it on
 * NR7 makes it worse. A volatility-scaled trigger on the same data clears the bar
 * out-of-sample. That is uncomfortable to print above a bracket built the other
 * way, which is exactly why it belongs here.
 */
function edgePanel(d) {
  const e = d.meta?.edge, band = d.meta?.band, cost = d.meta?.costPts;
  if (!e) return '';

  const row = (v) => {
    const isCurrent = v.key === 'nr7c';
    const t = v.tLow;
    const verdict = t >= e.hurdle ? 'clears' : t >= 2 ? 'weak' : 'no edge';
    const cls = t >= e.hurdle ? 'ev-clears' : t >= 2 ? 'ev-weak' : 'ev-none';
    return `<tr class="${isCurrent ? 'ev-now' : ''}">
      <td style="text-align:left">${v.label}${isCurrent ? ' <span class="ev-tag">today</span>' : ''}${
        v.oos ? ' <span class="muted" style="font-size:11px">out-of-sample</span>' : ''}</td>
      <td>${v.n.toLocaleString()}</td>
      <td>+${v.expLow.toFixed(3)}R</td>
      <td>${v.tLow.toFixed(2)}</td>
      <td>${v.expHigh != null ? `+${v.expHigh.toFixed(3)}R` : '—'}</td>
      <td class="${cls}">${verdict}</td>
    </tr>`;
  };

  return `<div class="panel">
    <h2>Measured edge — net of costs</h2>
    <p class="hint">${e.sample}. Entry on first touch, stop at 2× the trigger distance, exit at the close.
      Friction is charged at <b>${cost.low} pts ($${(cost.low * 2).toFixed(2)})</b> and
      <b>${cost.high} pts ($${(cost.high * 2).toFixed(2)})</b> per round trip on MNQ.
      The hurdle is <b>t ≥ ${e.hurdle}</b> — Harvey–Liu's t≥3 for a new factor, adjusted for the ~21 variants tested.</p>

    <table>
      <thead><tr><th style="text-align:left">Trigger</th><th>n</th>
        <th>exp @ ${cost.low}pt</th><th>t</th><th>exp @ ${cost.high}pt</th><th>verdict</th></tr></thead>
      <tbody>${e.variants.map(row).join('')}</tbody>
    </table>

    <p class="hint" style="margin:14px 0 0"><b>Read this honestly.</b> The bracket above uses the fixed
      Stretch, and today's NR7 conditioning is the weakest row in the table — <b>t = 0.67, indistinguishable
      from zero</b>. The volatility-scaled trigger is the only construction that clears the hurdle, and it
      does so out-of-sample across 11 of 11 years. The bracket has not been rebuilt on it yet; that is a
      change to how you trade, not a display setting.</p>

    ${band?.available ? `
      <h3 style="font-size:12.5px;margin:18px 0 6px">What the volatility-scaled trigger looks like today</h3>
      <p class="hint">Rebuilt live from the same ${band.lookback}-session window at ${band.mult}×. Unlike the
        Stretch — one distance fixed before the bell — it widens as the session ages:</p>
      <table><tbody>
        <tr><td>08:35 CT</td><td><b>${band.at0935 != null ? n0(band.at0935) : '—'}</b> pts from the open</td>
            <td class="muted">vs Stretch ${n0(d.nextStretch)} pts, fixed all day</td></tr>
        <tr><td>09:00 CT</td><td><b>${band.at1000 != null ? n0(band.at1000) : '—'}</b> pts</td><td></td></tr>
        <tr><td>09:30 CT</td><td><b>${band.at1030 != null ? n0(band.at1030) : '—'}</b> pts</td><td></td></tr>
        <tr><td>11:00 CT</td><td><b>${band.at1200 != null ? n0(band.at1200) : '—'}</b> pts</td><td></td></tr>
      </tbody></table>` : ''}

    <p class="hint" style="margin:14px 0 0">Caveats that travel with these numbers: the sample is the
      NAS100 index as a stand-in for NQ; stops are assumed to fill at their price, which real ones do not;
      and the 0.75× band triggers on roughly 95% of sessions, so it is closer to trading most days with an
      adaptive trigger than to a selective setup.</p>
  </div>`;
}

/** One side of the trade: what it is in plain terms, how good its shape is, targets. */
function sidePanel(d, dir, active) {
  const orb = d.orb, risk = 2 * d.nextStretch, riskUsd = risk * MNQ_PT;
  const entry = dir === 'long' ? orb.buyStop : orb.sellStop;
  const exit = dir === 'long' ? orb.sellStop : orb.buyStop;
  const c = sideConfidence(d, dir);

  const meter = c ? `
    <div class="conf">
      <div class="conf-top">
        <span class="conf-band conf-${c.band}">${c.band}</span>
        <span class="conf-score">${c.score}<span class="conf-of">/100</span></span>
      </div>
      <div class="conf-track"><div class="conf-fill conf-${c.band}" style="width:${c.score}%"></div></div>
      <ul class="conf-why">${c.reasons.map((r) => `<li>${r}</li>`).join('')}</ul>
    </div>` : '';

  return `<div class="panel ${active ? 'panel-active' : 'panel-dim'}">
    <h2><span class="dir-dot ${dir}"></span>${dir === 'long' ? 'Buy a break upward' : 'Sell a break downward'}</h2>
    <p class="sideline">
      <span class="sl-act">${dir === 'long' ? 'Buy above' : 'Sell below'}</span>
      <span class="sl-px">${n1(entry)}</span>
    </p>
    <p class="hint" style="margin:0 0 12px">Exit if it trades back to <b>${n1(exit)}</b> —
      ${n0(risk)} points against you, $${riskUsd.toFixed(0)} per MNQ contract.</p>
    ${meter}
    ${targetTable(d, dir)}
  </div>`;
}

function renderTrade(d) {
  const pane = $('#pane-trade');
  if (!d || d.error) { pane.innerHTML = '<div class="panel"><p class="hint">No data.</p></div>'; return; }

  const orb = d.orb, g = d.gamma, pj = d.projection, gr = setupGrade(d);
  if (!orb?.available) { pane.innerHTML = '<div class="panel"><p class="hint">No bracket available.</p></div>'; return; }

  const risk = 2 * d.nextStretch;
  const riskUsd = risk * MNQ_PT;
  const firstLongR = g?.available && g.firstAboveBuy ? (g.firstAboveBuy.value - orb.buyStop) / risk : null;
  const firstShortR = g?.available && g.firstBelowSell ? (orb.sellStop - g.firstBelowSell.value) / risk : null;
  const entry = tradeSide === 'long' ? orb.buyStop : orb.sellStop;
  const stop = tradeSide === 'long' ? orb.sellStop : orb.buyStop;

  pane.innerHTML = `
    <div class="panel">
      <div class="grade grade-${gr.level}"><span class="g-icon">${gr.icon}</span><span class="g-label">${gr.label}</span></div>
      <h2 class="headline">${d.verdict} — ${orb.live ? "today's" : "next"} session</h2>
      <!-- The grade's own sentence belongs here, not only in the brief. Without it
           a "no setup" badge sits above two large trigger tiles with nothing saying
           the bracket below is the baseline rather than an edge — and the tiles are
           what the eye lands on. -->
      <p class="synth"><b>${gr.detail}</b></p>
      <p class="synth">${orb.referenceLabel}. ${synthesis(d)}</p>

      <div class="tradebar">
        <div class="tb up"><span class="tb-k">Go long above</span>
          <span class="tb-v">${n1(orb.buyStop)}</span><span class="tb-s">${n0(d.nextStretch)} pts over the open</span></div>
        <div class="tb dn"><span class="tb-k">Go short below</span>
          <span class="tb-v">${n1(orb.sellStop)}</span><span class="tb-s">${n0(d.nextStretch)} pts under the open</span></div>
        <div class="tb"><span class="tb-k">Risk if wrong</span>
          <span class="tb-v">${n0(risk)} <span class="tb-u">pts</span></span><span class="tb-s">$${riskUsd.toFixed(0)} per MNQ · this is 1R</span></div>
        <div class="tb"><span class="tb-k">Range expected</span>
          <span class="tb-v">${n0(pj.median)} <span class="tb-u">pts</span></span><span class="tb-s">${n0(pj.p25)}–${n0(pj.p75)} middle half</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="ladder-head">
        <h2 style="margin:0">The session</h2>
        <div class="sideswitch" role="group" aria-label="Trade direction">
          <button type="button" data-side="long" aria-pressed="${tradeSide === 'long'}">Long</button>
          <button type="button" data-side="short" aria-pressed="${tradeSide === 'short'}">Short</button>
        </div>
      </div>
      <p class="hint">Price up the side, the session clock along the bottom. The shaded band is the range
        Crabel expects; horizontal lines are levels; vertical lines are scheduled releases.</p>
      ${masterChart(d, tradeSide)}
    </div>

    <div class="two">
      ${sidePanel(d, 'long', tradeSide === 'long')}
      ${sidePanel(d, 'short', tradeSide === 'short')}
    </div>

    ${edgePanel(d)}

    <div class="panel">
      <h2>What the rating means</h2>
      <p class="hint" style="margin:0">It scores the <b>shape</b> of each side — how much of the projected
        day you must capture to make 1R, how much clear ground sits in front of the entry, and how many
        levels are in the way. <b>It says nothing about which way price will go.</b> No cohort in
        ${d.stats?.sampleSessions?.toLocaleString() ?? '—'} sessions shows a directional edge, so a
        confidence number that leaned long or short would be inventing information. Both sides can be
        poor at once, and today they nearly are.</p>
    </div>

    <div class="panel">
      <h2>The day, left to right</h2>
      <div class="keyrow">
        <span class="key"><i class="sw-hot"></i>Window where extremes cluster</span>
        <span class="key"><i class="sw-cold"></i>Quiet window</span>
        <span class="key"><i class="sw-high"></i>High-impact release</span>
        <span class="key"><i class="sw-med"></i>Medium / low</span>
        ${zoneSchedule().closed ? '' : '<span class="key"><i class="sw-now"></i>Now</span>'}
      </div>
      <p class="hint">Five lanes on one clock, 01:00–15:00 CT, from
        ${(d.meta?.zones?.sessions ?? 0).toLocaleString()} sessions: scheduled releases, the named windows,
        where the day's extremes actually form, how much of the day is already decided by each moment,
        and what you should be doing. Amber shading is the blast radius around a high-impact print.</p>
      ${dayRoadmap(d)}
    </div>

    <div class="panel">
      <h2>What has to be true</h2>
      <ul class="checks">
        <li><b>Rebracket off the 8:30 CT open.</b> ${orb.live ? 'Live session — the bracket above already uses it.'
          : 'These levels are built off the last RTH close and will move.'}</li>
        <li><b>First signal only.</b> ${pct(d.stats?.baseline?.expansionRate ?? 0)} of ordinary sessions beat the
          20-day average range; this setup does it ${pct((d.stats?.current?.insufficient ? d.stats?.nearestUsable : d.stats?.current)?.expansionRate ?? 0)}
          of the time — expansion is relative to the setup day, not to a big session.</li>
        <li><b>Direction is not predicted.</b> No cohort in ${d.stats?.sampleSessions?.toLocaleString() ?? '—'} sessions
          clears two standard errors of the market's own drift. Both orders rest; the market picks.</li>
        <li><b>Timing.</b> ${pct(d.meta?.zones?.findings?.earlyExtremeRate ?? 0)} of sessions set their extreme before
          09:30 CT, and the opening 30 minutes runs
          ${(d.meta?.zones?.zones?.[0]?.concentration ?? 0).toFixed(1)}× chance. Late entries are a different trade.</li>
        ${g?.available && g.inside.length ? `<li><b>${g.inside.length} gamma levels sit inside the bracket.</b>
          Price transacts through them before either order fills — the bracket is not firing into clean space.</li>` : ''}
        ${g?.available && g.stale0dteCount ? `<li><b>${g.stale0dteCount} levels are expired 0DTE.</b>
          Excluded here, but re-pull after the open or you are trading Friday's walls.</li>` : ''}
        ${d.calendar?.nextHigh ? `<li><b>${d.calendar.nextHigh.title}</b> at ${d.calendar.nextHigh.ctTime ?? ct(d.calendar.nextHigh.etTime)} CT
          (${d.calendar.nextHigh.window.replace('-', ' ')}) — a bracket touched after it is the release talking,
          not the pattern.</li>` : ''}
      </ul>
    </div>`;

  // Toggling direction only recolours; it never refetches.
  pane.querySelectorAll('.sideswitch button').forEach((b) => {
    b.addEventListener('click', () => {
      tradeSide = b.dataset.side;
      localStorage.setItem('oceans-crabel-side', tradeSide);
      renderTrade(lastData);
    });
  });
}

/**
 * The session brief: one self-contained document tying every source together.
 *
 * This is the print target as well as a tab, so it carries its own context —
 * a reader who has never seen the dashboard, human or model, should be able to
 * follow it without the other tabs. Every claim states its sample and source,
 * because a brief that hides its provenance is just an opinion.
 */
/**
 * Watch — the scheduled things that can override the pattern, and the headlines
 * that might explain a move.
 *
 * No sentiment scoring and no directional inference from news. Nothing in this
 * tool has shown that works, and a headline dressed as a signal is worse than
 * no headline. This is context and a clock.
 */
function renderWatch(d) {
  const pane = $('#pane-watch');
  if (!d || d.error) { pane.innerHTML = '<div class="panel"><p class="hint">No data.</p></div>'; return; }
  const w = d.watch;
  if (!w) { pane.innerHTML = '<div class="panel"><p class="hint">Watch data unavailable.</p></div>'; return; }

  const evRow = (e) => `<tr>
    <td class="w-when">${until(e.epoch)}</td>
    <td><b>${e.ctTime ?? ct(e.etTime)}</b> <span class="muted">CT</span></td>
    <td style="text-align:left">${e.title}</td>
    <td style="text-align:left" class="${e.impact === 'High' ? 'sig' : 'muted'}">${e.impact}</td>
    ${e.forecast ? `<td class="muted">fc ${e.forecast}</td>` : '<td></td>'}
  </tr>`;

  // Day-by-day for the whole week, so "what's on Wednesday" is answerable
  // without waiting for Wednesday.
  const weekBlock = w.byDay?.length ? `
    <div class="panel">
      <h2>${w.weekIsNext ? 'The week ahead' : 'This week'}</h2>
      <p class="hint">All times Central. ${w.weekIsNext
        ? 'The week just closed, so this is the one that opens Monday — nothing here is today.'
        : 'Today is highlighted.'}${
        w.macroCovered === false ? ' <b>The macro feed has not published it yet</b>, so empty days mean unknown, not quiet.' : ''}</p>
      <table>
        <thead><tr><th style="text-align:left">Day</th><th style="text-align:left">Macro</th>
          <th style="text-align:left">Earnings that move NQ</th></tr></thead>
        <tbody>${w.byDay.map((d2) => {
          const isToday = d2.date === w.today;
          const macro = d2.high.length
            ? d2.high.map((e) => `<b>${e.ctTime ?? ct(e.etTime)}</b> ${e.title}`).join('<br>')
            : d2.events.length ? `<span class="muted">${d2.events.length} lower-impact</span>`
            : '<span class="muted">—</span>';
          const earn = d2.earnings.length
            ? d2.earnings.map((e) => `<b class="${e.tier === 'mega' ? 'sig' : ''}">${e.symbol}</b> <span class="muted">${e.when}</span>`).join('<br>')
            : '<span class="muted">—</span>';
          return `<tr class="${isToday ? 'ev-now' : ''}">
            <td style="text-align:left"><b>${dayName(d2.date)}</b>${isToday ? ' <span class="ev-tag">today</span>' : ''}</td>
            <td style="text-align:left">${macro}</td>
            <td style="text-align:left">${earn}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>` : '';

  const earnBlock = w.earnings?.available ? `
    <div class="panel">
      <h2>Earnings — Nasdaq heavyweights</h2>
      <p class="hint">${w.earnings.source} · <b>${w.earnings.totalReports.toLocaleString()}</b> US companies
        report this week; these are the ones whose weight can move the index on their own.
        ${w.earnings.stale ? '<b>Cached copy.</b>' : ''}</p>
      ${(w.earnings.mega.length || w.earnings.large.length)
        ? `<table>
             <thead><tr><th style="text-align:left">Symbol</th><th style="text-align:left">Company</th>
               <th style="text-align:left">Day</th><th style="text-align:left">Session</th></tr></thead>
             <tbody>${[...w.earnings.mega, ...w.earnings.large].map((e) => `<tr>
               <td style="text-align:left"><b class="${e.tier === 'mega' ? 'sig' : ''}">${e.symbol}</b>${
                 e.tier === 'mega' ? ' <span class="ev-tag">mega-cap</span>' : ''}</td>
               <td style="text-align:left" class="muted">${e.name.slice(0, 40)}</td>
               <td style="text-align:left">${dayName(e.date)}</td>
               <td style="text-align:left" class="muted">${e.when}</td></tr>`).join('')}
             </tbody>
           </table>
           <p class="hint" style="margin:10px 0 0">A mega-cap reporting after the close sets the gap you
             open into the next morning — that is a rebracket, not a continuation.</p>`
        : `<p class="hint" style="margin:0">No index-heavyweight reports scheduled this week.
             ${w.earnings.totalReports.toLocaleString()} smaller companies do report; none carry enough
             weight to move NQ on their own.</p>`}
    </div>` : `
    <div class="panel"><h2>Earnings</h2>
      <p class="hint" style="margin:0">Unavailable — ${w.earnings?.reason ?? 'no source'}</p></div>`;

  const group = (title, list, note) => `
    <div class="panel">
      <h2>${title}</h2>
      ${list.length
        ? `<p class="hint">${note}</p><table><tbody>${list.map(evRow).join('')}</tbody></table>`
        : `<p class="hint" style="margin:0">Nothing scheduled. ${note}</p>`}
    </div>`;

  const cal = w.calendar;
  const headline = w.highImpact.length
    ? `<div class="panel">
         <h2>The one to plan around</h2>
         <div class="ev-hero ev-${w.highImpact[0].window}">
           <div class="ev-when"><span class="ev-count">${until(w.highImpact[0].epoch)}</span>
             <span class="ev-time">${w.highImpact[0].ctTime ?? ct(w.highImpact[0].etTime)} CT · ${w.highImpact[0].window.replace('-', ' ')}</span></div>
           <div class="ev-what"><span class="ev-impact">High impact</span>
             <span class="ev-title">${w.highImpact[0].title}</span>
             ${w.highImpact[0].forecast ? `<span class="ev-meta">forecast ${w.highImpact[0].forecast}${
               w.highImpact[0].previous ? ` · previous ${w.highImpact[0].previous}` : ''}</span>` : ''}</div>
         </div>
         ${w.highImpact[0].window === 'in-session'
           ? `<p class="hint" style="margin:12px 0 0"><b>Lands mid-session.</b> A bracket touched after it is
              the release moving price, not the pattern — a different trade with different odds.</p>`
           : `<p class="hint" style="margin:12px 0 0">Lands before the bell, so it prices into the 8:30 CT open.
              Recompute the bracket off that open.</p>`}
       </div>`
    : `<div class="panel"><h2>The one to plan around</h2>
         <p class="hint" style="margin:0">No high-impact release scheduled${
           cal?.exhausted ? " in this week's feed — ForexFactory publishes a current-week file only, so it "
             + 'empties out until the new one lands. That is a feed limit, not a clear calendar.' : '.'}</p>
       </div>`;

  const news = w.news.available
    ? `<div class="panel">
         <h2>Headlines · last 72 hours</h2>
         <p class="hint">Yahoo, on QQQ and ^NDX${w.news.stale ? ` · <b>cached</b> — ${w.news.note}` : ''}.
           Listed for context only — <b>nothing here is scored or turned into a signal.</b></p>
         <ul class="newslist">${w.news.items.map((n) => `
           <li><span class="n-age">${n.ageMinutes < 60 ? `${n.ageMinutes}m` : `${Math.round(n.ageMinutes / 60)}h`}</span>
             <span class="n-title">${n.link ? `<a href="${n.link}" target="_blank" rel="noopener">${n.title}</a>` : n.title}</span>
             <span class="n-pub">${n.publisher}</span></li>`).join('')}
         </ul>
       </div>`
    : `<div class="panel"><h2>Headlines</h2>
         <p class="hint" style="margin:0">Unavailable — ${w.news.reason}</p></div>`;

  pane.innerHTML = `
    ${headline}
    ${weekBlock}
    ${earnBlock}
    ${group('Before the open', w.beforeOpen, 'Lands before 08:30 CT — priced into the open, so rebracket after it.')}
    ${group('During the session', w.inSession, 'Lands between 08:30 and 15:00 CT, while your orders are live.')}
    ${group('After the close', w.afterClose, 'After 15:00 CT — sets up tomorrow, not today.')}
    ${news}
    <div class="panel">
      <h2>Not covered here</h2>
      <ul class="checks">${w.notCovered.map((t) => `<li>${t}</li>`).join('')}</ul>
      <p class="hint" style="margin:10px 0 0">Listing the gaps because an events page that looks complete
        is more dangerous than one that admits what it misses.</p>
    </div>`;
}

function renderBrief(d) {
  const pane = $('#pane-brief');
  if (!d || d.error) { pane.innerHTML = '<div class="panel"><p class="hint">No data.</p></div>'; return; }

  const orb = d.orb, g = d.gamma, pj = d.projection, st = d.stats, z = d.meta?.zones, cal = d.calendar;
  const gr = setupGrade(d);
  const q = st?.available ? (st.current.insufficient ? st.nearestUsable : st.current) : null;
  const risk = 2 * d.nextStretch;
  const riskUsd = risk * MNQ_PT;

  const conf = { long: sideConfidence(d, 'long'), short: sideConfidence(d, 'short') };
  const rTable = (dir) => {
    const entry = dir === 'long' ? orb.buyStop : orb.sellStop;
    const list = ((dir === 'long' ? g?.above : g?.below) ?? []).slice(0, 4);
    if (!list.length) return '<em>no levels within the projection</em>';
    return list.map((l) => {
      const move = Math.abs(l.value - entry);
      return `${n1(l.value)} (${n0(move)} pts, ${(move / risk).toFixed(2)}R) — ${l.names.slice(0, 2).join(' / ')}`;
    }).join('<br>');
  };

  const ev = (cal?.upcoming ?? []).filter((e) => e.impact === 'High').slice(0, 3);

  pane.innerHTML = `
    <article class="brief">
      <header class="brief-head">
        <div>
          <h1>Session brief — ${orb.live ? d.currentSession?.date ?? 'today' : 'next session'}</h1>
          <p class="brief-meta">MNQ / NQ · generated ${new Date().toLocaleString('en-US', { hour12: false })} ·
            last complete RTH session ${d.last.date}</p>
        </div>
        <div class="brief-grade grade-${gr.level}">${gr.icon} ${gr.label}</div>
      </header>

      <section>
        <h2>1 · The call</h2>
        <p class="lead">${d.verdict}. ${gr.detail}</p>
        <p>${synthesis(d)}</p>
        <p class="prov">Setup flags from ${d.sessionCount} RTH sessions of NQ=F 5-minute bars.
          Base rates from ${st?.sampleSessions?.toLocaleString() ?? '—'} sessions, ${st?.source ?? '—'}.</p>
      </section>

      <section>
        <h2>2 · The orders</h2>
        <table class="briefkv">
          <tr><td>Buy a break up</td><td><b>above ${n1(orb.buyStop)}</b></td>
              <td class="prov">${n0(d.nextStretch)} pts over the reference · ${orb.referenceLabel}</td></tr>
          <tr><td>Sell a break down</td><td><b>below ${n1(orb.sellStop)}</b></td>
              <td class="prov">${n0(d.nextStretch)} pts under the reference ${n1(orb.reference)}</td></tr>
          <tr><td>Exit if wrong</td><td><b>${n0(risk)}</b> pts · $${riskUsd.toFixed(0)}</td>
              <td class="prov">at the opposite level; this is 1R, MNQ at $2.00/pt</td></tr>
          <tr><td>Shape, long</td><td><b>${conf.long?.band ?? '—'}</b> ${conf.long ? `(${conf.long.score}/100)` : ''}</td>
              <td class="prov">${conf.long?.reasons.join(' · ') ?? ''}</td></tr>
          <tr><td>Shape, short</td><td><b>${conf.short?.band ?? '—'}</b> ${conf.short ? `(${conf.short.score}/100)` : ''}</td>
              <td class="prov">${conf.short?.reasons.join(' · ') ?? ''}</td></tr>
          <tr><td>Size</td><td><b>${Math.floor(500 / riskUsd)}</b> @ $500 · <b>${Math.floor(1000 / riskUsd)}</b> @ $1,000</td>
              <td class="prov">floor(budget ÷ risk); ignores firm limits</td></tr>
        </table>
        <p>Both orders wait; you take whichever price reaches first, then cancel the other or leave it as
          the exit. Close before the bell.
          ${orb.live ? '' : 'These are built off the last RTH close — <b>recompute off the 8:30 CT open before placing them</b>.'}
          The shape ratings above score the trade's geometry, <b>not its direction</b> — no cohort in
          ${st?.sampleSessions?.toLocaleString() ?? '—'} sessions shows a directional edge.</p>
      </section>

      <section>
        <h2>3 · The price map</h2>
        <p class="prov">Long view. Bands: options-implied ±1σ, projected range, and ${d.last.date}'s actual
          range. Aqua lines marked ▸ are targets; grey lines are levels that are not targets for a long.</p>
        ${priceLadder(d, 'long')}
      </section>

      <section>
        <h2>4 · Targets</h2>
        <div class="two">
          <div><h3>Long — break ${n1(orb.buyStop)}</h3>${targetTable(d, 'long')}</div>
          <div><h3>Short — break ${n1(orb.sellStop)}</h3>${targetTable(d, 'short')}</div>
        </div>
        <p class="prov">R is measured against the ${n0(risk)}-pt bracket-to-bracket stop; dollars are MNQ at
          $${CONTRACT.pointValue.toFixed(2)}/point. Levels are MenthorQ gamma, blindspot and swing levels for
          ${g?.ticker ?? 'NQ'}, end-of-day vintage only.</p>
      </section>

      <section>
        <h2>5 · Positioning</h2>
        ${g?.available ? `
          <p>Clear air is <b>${n0(g.airLong)} pts</b> above the buy stop and <b>${n0(g.airShort)} pts</b> below the
            sell stop — ${pct(g.airLongPctOfProjection, 0)} and ${pct(g.airShortPctOfProjection, 0)} of the
            ${n0(pj.median)}-pt projection respectively.</p>
          <p><b>${g.inside.length} levels sit inside the ${n0(orb.buyStop - orb.sellStop)}-pt bracket</b>${
            g.inside.length ? `, all of them: ${g.inside.map((l) => `${n1(l.value)} ${l.names[0]}`).join(', ')}` : ''}.
            Price transacts through these before either order fills.</p>
          ${g.stale0dteCount ? `<p class="warn-line">${g.stale0dteCount} levels are 0DTE from a prior session and
            expire with their options — excluded here, but re-pull after the open.</p>` : ''}`
          : `<p>Gamma levels unavailable — ${g?.reason ?? 'no data'}.</p>`}
      </section>

      <section>
        <h2>6 · The day</h2>
        ${dayRoadmap(d)}
