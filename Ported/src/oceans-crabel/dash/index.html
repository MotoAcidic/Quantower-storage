<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean's Crabel</title>
<style>
  :root {
    color-scheme: light;
    --page:            #f9f9f7;
    --surface-1:       #fcfcfb;
    --text-primary:    #0b0b0b;
    --text-secondary:  #52514e;
    --text-muted:      #898781;
    --gridline:        #e1e0d9;
    --baseline:        #c3c2b7;
    --border:          rgba(11,11,11,0.10);
    --bar-plain:       #86b6ef;   /* blue 250 - ordinal low step */
    --bar-flag:        #2a78d6;   /* blue 450 - ordinal high step */
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
    /* Trade roles. Target is aqua rather than green: green↔red measures ΔE 4.1
       under deuteranopia, far below the floor, so a colourblind reader could not
       tell a stop from a target. Aqua↔red clears it (9.9 light / 7.2 dark), and
       every mark still carries its role as a word. */
    --trade-entry:     #2a78d6;
    --trade-stop:      #d03b3b;
    --trade-target:    #1baf7a;
    /* Elevation. Three planes only: page, card, inset. More than three and the
       eye stops reading them as depth. */
    --surface-2:       #ffffff;
    --inset:           #f2f2ef;
    --shadow:          0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
    --accent-soft:     rgba(42,120,214,.10);
    --warn-soft:       rgba(250,178,25,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --bar-plain:      #184f95;  /* blue 600 */
      --bar-flag:       #3987e5;  /* blue 400 */
      --trade-entry:    #3987e5;
      --trade-target:   #199e70;
      --surface-2:      #232322;
      --inset:          #131312;
      --shadow:         0 1px 2px rgba(0,0,0,.40), 0 6px 20px rgba(0,0,0,.32);
      --accent-soft:    rgba(57,135,229,.14);
      --warn-soft:      rgba(250,178,25,.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --bar-plain:      #184f95;
    --bar-flag:       #3987e5;
    --trade-entry:    #3987e5;
    --trade-target:   #199e70;
    --surface-2:      #232322;
    --inset:          #131312;
    --shadow:         0 1px 2px rgba(0,0,0,.40), 0 6px 20px rgba(0,0,0,.32);
    --accent-soft:    rgba(57,135,229,.14);
    --warn-soft:      rgba(250,178,25,.14);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 22px 20px 64px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  /* One consistent card. Every panel is this; nothing invents its own chrome. */
  .panel, .verdict, .source, .touch, .brief, .side, .tile, .zchip, details.panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .panel, .verdict { padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .panel > h2:first-child { margin-top: 0; }

  /* Section headings read as labels, not shouts. */
  .panel h2 { font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-muted); margin: 0 0 4px; }
  /* A headline is a title, not a section label — it opts out of the label style. */
  .panel h2.headline { font-size: 21px; font-weight: 600; letter-spacing: -.02em;
    text-transform: none; color: var(--text-primary); margin: 6px 0 2px; }
  .panel .hint { color: var(--text-muted); font-size: 12.5px; margin: 0 0 14px; line-height: 1.5; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-muted); font-size: 13px; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--status-good); }
  .dot.stale { background: var(--status-warning); }

  /* Source banner: which feed is live, and whether its Stretch is tradable. */
  .source {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 14px; border-radius: 8px; margin-bottom: 16px;
    border: 1px solid var(--border); background: var(--surface-1);
    font-size: 13.5px;
  }
  .source .icon { font-size: 15px; line-height: 1.35; }
  .source.warn { border-color: color-mix(in srgb, var(--status-warning) 55%, var(--border)); }
  .source b { font-weight: 600; }
  .source .why { color: var(--text-secondary); display: block; margin-top: 2px; }

  .verdict {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 14px;
  }
  .verdict .label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .verdict .text { font-size: 25px; font-weight: 600; letter-spacing: -0.02em; margin-top: 5px; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-secondary);
  }
  .chip.on { border-color: transparent; background: var(--bar-flag); color: #fff; }
  .chip.unknown { color: var(--text-muted); font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .label { color: var(--text-muted); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 3px; letter-spacing: -0.02em; }
  .tile .value.hero { font-size: 50px; line-height: 1.05; }
  .tile .note { color: var(--text-secondary); font-size: 12px; margin-top: 3px; }
  .tile .value.na { color: var(--text-muted); font-size: 19px; font-weight: 500; }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 3px; }
  .panel .hint { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; }

  .orb { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-end; }
  .orb .leg .k { color: var(--text-muted); font-size: 12px; }
  .orb .leg .v { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }

  .legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  svg { display: block; width: 100%; overflow: visible; }
  .axis { fill: var(--text-muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }

  /* Every number in a column aligns; only display figures use proportional. */
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  td { letter-spacing: .01em; }
  th { text-align: right; color: var(--text-muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--gridline); font-size: 11.5px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--gridline); text-align: right; }
  tbody tr:last-child td { border-bottom: none; }
  .muted { color: var(--text-muted); }
  .flagcell { color: var(--text-secondary); font-weight: 600; }

  .tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.16);
    font-variant-numeric: tabular-nums; z-index: 10; max-width: 230px;
  }
  .tip b { display: block; margin-bottom: 3px; font-size: 12.5px; }
  .err { border-color: color-mix(in srgb, var(--status-critical) 55%, var(--border)); }

  .callout {
    border-left: 3px solid var(--status-warning);
    background: color-mix(in srgb, var(--status-warning) 8%, transparent);
    padding: 10px 13px; border-radius: 0 7px 7px 0; font-size: 13px;
    color: var(--text-secondary); margin-top: 4px;
  }
  .callout b { color: var(--text-primary); }
  tr.baseline-row td { border-top: 1px solid var(--baseline); color: var(--text-secondary); }

  .synth { margin: 10px 0 0; color: var(--text-secondary); font-size: 14px; max-width: 74ch; }
  .synth b { color: var(--text-primary); }

  /* Setup grade. A status, so it wears a status colour — always with an icon and
     a word, never colour alone. */
  .grade { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700;
           letter-spacing: .02em; text-transform: uppercase; margin-bottom: 8px; }
  .grade .g-icon { font-size: 13px; }
  .grade-good { color: var(--status-good); }
  .grade-weak, .grade-unknown { color: var(--text-muted); }
  .grade-none { color: var(--text-muted); }

  .clock { font-variant-numeric: tabular-nums; color: var(--text-secondary); font-weight: 600;
           margin-right: 12px; }

  .alertbtn { appearance: none; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
    background: none; color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 11px; margin-right: 12px; }
  .alertbtn:hover:not(:disabled) { color: var(--text-primary); }
  .alertbtn.on { color: var(--status-good); border-color: color-mix(in srgb, var(--status-good) 45%, var(--border)); }
  .alertbtn:disabled { cursor: default; opacity: .6; }
  .pdfbtn { text-decoration: none; display: inline-block; }
  .pdfbtn:hover { color: var(--text-primary); }
  .pdfbtn.busy { opacity: .55; pointer-events: none; }

  /* Bracket-touch state. A status, so icon + words carry it, not colour alone. */
  .touch { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 8px;
    margin-bottom: 16px; border: 1px solid var(--border); background: var(--surface-1); font-size: 13.5px; }
  .touch .icon { font-size: 13px; line-height: 1.45; }
  .touch.hit { border-color: color-mix(in srgb, var(--status-good) 55%, var(--border)); }
  .touch.hit .icon { color: var(--status-good); }
  .touch.idle { color: var(--text-secondary); }

  .ev-hero { display: flex; gap: 22px; align-items: center; padding: 14px 16px; border-radius: 9px;
    background: color-mix(in srgb, var(--text-primary) 5%, transparent); border-left: 3px solid var(--bar-flag); }
  .ev-hero.ev-in-session { border-left-color: var(--status-warning); }
  .ev-when { display: flex; flex-direction: column; min-width: 132px; }
  .ev-count { font-size: 27px; font-weight: 600; letter-spacing: -.02em; }
  .ev-time { font-size: 11.5px; color: var(--text-muted); }
  .ev-what { display: flex; flex-direction: column; gap: 2px; }
  .ev-impact { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
               color: var(--status-warning); }
  .ev-title { font-size: 15px; font-weight: 600; }
  .ev-meta { font-size: 11.5px; color: var(--text-muted); }

  /* Watch tab. */
  .w-when { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .newslist { list-style: none; margin: 0; padding: 0; }
  .newslist li { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid var(--gridline); font-size: 13.5px; }
  .newslist li:last-child { border-bottom: none; }
  .n-age { color: var(--text-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .n-title { color: var(--text-secondary); }
  .n-title a { color: var(--text-secondary); text-decoration: none; }
  .n-title a:hover { color: var(--text-primary); text-decoration: underline; }
  .n-pub { color: var(--text-muted); font-size: 11px; white-space: nowrap; }

  /* Claim verdicts. Icon + word carry it; colour only reinforces. */
  .stalebar { display: flex; align-items: center; gap: 11px; padding: 11px 14px; margin-bottom: 14px;
    border-radius: 8px; font-size: 13.5px; background: var(--surface-1);
    border: 1px solid color-mix(in srgb, var(--status-warning) 55%, var(--border)); }
  .stalebar .icon { font-size: 15px; color: var(--status-warning); }
  .stalebar b { color: var(--text-primary); }
  .stalebar div { color: var(--text-secondary); }
  .stalebar button { margin-left: auto; appearance: none; font: inherit; font-size: 12.5px;
    font-weight: 600; cursor: pointer; padding: 5px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: none; color: var(--text-primary); }
  .stalebar button:hover { border-color: var(--text-muted); }

  /* Session countdown strip. */
  .zstrip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .zstrip.closed { display: flex; align-items: baseline; gap: 12px; padding: 11px 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); }
  .z-now { font-size: 14px; font-weight: 600; }
  .z-sub { font-size: 13px; color: var(--text-secondary); }
  .z-sub b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .zchip { display: flex; flex-direction: column; gap: 1px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); min-width: 118px; }
  .zchip.active { border-color: color-mix(in srgb, var(--status-good) 55%, var(--border));
    background: color-mix(in srgb, var(--status-good) 9%, var(--surface-1)); }
  .zc-label { font-size: 11.5px; font-weight: 600; }
  .zc-time { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .zchip.active .zc-time { color: var(--status-good); font-weight: 600; }
  /* Concentration sits beside the countdown so it can never collide with a long
     zone name. Earned by measurement, so it is stated as a number. */
  .zc-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .zc-conc { font-size: 10.5px; font-weight: 700; color: var(--text-muted); }
  .zchip.hot .zc-conc { color: var(--bar-flag); }
  .zchip.hot { border-color: color-mix(in srgb, var(--bar-flag) 45%, var(--border)); }

  /* Session brief — also the print target, so it is styled as a document. */
  .brief { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 30px 34px; max-width: 900px; }
  .brief-head { display: flex; align-items: flex-start; gap: 20px; padding-bottom: 16px;
    border-bottom: 2px solid var(--border); margin-bottom: 4px; }
  .brief h1 { font-size: 23px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
  .brief-meta { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }
  .brief-grade { margin-left: auto; font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; white-space: nowrap; padding-top: 4px; }
  .brief section { padding: 18px 0; border-bottom: 1px solid var(--gridline); }
  .brief section:last-child { border-bottom: none; }
  .brief h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-muted); margin: 0 0 10px; }
  .brief h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .brief p { margin: 0 0 10px; font-size: 13.5px; color: var(--text-secondary); }
  .brief p:last-child { margin-bottom: 0; }
  .brief b { color: var(--text-primary); }
  .brief .lead { font-size: 16px; color: var(--text-primary); font-weight: 500; }
  .brief ul { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--text-secondary); }
  .brief li { margin-bottom: 7px; }
  .prov { font-size: 11.5px !important; color: var(--text-muted) !important; }
  .warn-line { border-left: 3px solid var(--status-warning); padding-left: 11px; }
  .briefkv { width: 100%; font-size: 13px; }
  .briefkv td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--gridline); text-align: left; }
  .briefkv td:first-child { color: var(--text-muted); width: 25%; }
  .briefkv td:nth-child(2) { width: 25%; }

  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .tabs, .live, .zstrip, .stalebar, #pane-live, #pane-trade, #pane-cheat, header .live { display: none !important; }
    #pane-brief { display: block !important; }
    .brief { border: none; padding: 0; max-width: none; background: #fff; }
    .brief section { break-inside: avoid; }
    .brief h1, .brief h2, .brief h3, .brief b, .brief .lead { color: #000; }
    .brief p, .brief li, .briefkv td { color: #222; }
    svg { max-width: 100%; }
  }

  /* Trade tab. Entry / stop / target are semantic states, so they use the
     status palette — always beside a word, never colour alone. */
  .ladder-head { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .sideswitch { margin-left: auto; display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .sideswitch button { appearance: none; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    background: none; color: var(--text-muted); border: none; padding: 5px 16px; }
  .sideswitch button[aria-pressed="true"] { background: var(--bar-flag); color: #fff; }
  .sideswitch button:hover[aria-pressed="false"] { color: var(--text-primary); }

  .keyrow { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--text-secondary); }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 13px; height: 3px; border-radius: 2px; display: inline-block; }
  .sw-entry { background: var(--trade-entry); }
  .sw-stop  { background: var(--trade-stop); }
  .sw-tp    { background: var(--trade-target); }
  .sw-risk  { background: color-mix(in srgb, var(--trade-stop) 30%, transparent); height: 10px !important; }
  .sw-hot   { background: var(--bar-flag); height: 10px !important; }
  .sw-cold  { background: var(--bar-plain); opacity: .3; height: 10px !important; }
  .sw-high  { background: var(--status-warning); }
  .sw-med   { background: var(--text-secondary); }
  .sw-now   { background: var(--status-good); }

  .dir-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .dir-dot.long { background: var(--trade-target); }
  .dir-dot.short { background: var(--trade-stop); }
  .panel-dim { opacity: .55; }
  .panel-active { border-color: color-mix(in srgb, var(--bar-flag) 40%, var(--border)); }

  .tp-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--trade-target); margin-right: 7px; vertical-align: 1px; }
  .r-good { color: var(--trade-target); font-weight: 700; }
  tr.tp-hit td { background: color-mix(in srgb, var(--trade-target) 7%, transparent); }
  .tradebar { display: flex; gap: 30px; flex-wrap: wrap; margin-top: 18px; padding-top: 16px;
    border-top: 1px solid var(--border); }
  .tb { display: flex; flex-direction: column; padding-left: 13px; border-left: 3px solid var(--border); }
  .tb.up { border-left-color: var(--trade-target); }
  .tb.dn { border-left-color: var(--trade-stop); }
  .tb-k { font-size: 11.5px; color: var(--text-muted); letter-spacing: .01em; }
  .tb-v { font-size: 30px; font-weight: 600; letter-spacing: -.025em; line-height: 1.2; margin-top: 1px; }
  .tb-u { font-size: 14px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
  .tb-s { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  /* Plain-language entry line: the verb and the price, nothing between them. */
  .sideline { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 6px; }
  .sl-act { font-size: 13px; color: var(--text-secondary); }
  .sl-px { font-size: 30px; font-weight: 600; letter-spacing: -.025em;
    font-variant-numeric: tabular-nums; }

  /* Confidence rates the trade's shape, never its direction. */
  .conf { margin: 12px 0 14px; padding: 12px 13px; border-radius: 9px; background: var(--inset); }
  .conf-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .conf-band { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 9px; border-radius: 999px; }
  .conf-band.conf-workable { color: var(--trade-target); background: color-mix(in srgb, var(--trade-target) 16%, transparent); }
  .conf-band.conf-marginal { color: var(--status-warning); background: var(--warn-soft); }
  .conf-band.conf-poor     { color: var(--trade-stop); background: color-mix(in srgb, var(--trade-stop) 14%, transparent); }
  .conf-score { margin-left: auto; font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .conf-of { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .conf-track { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text-primary) 8%, transparent); overflow: hidden; }
  .conf-fill { height: 100%; border-radius: 3px; }
  .conf-fill.conf-workable { background: var(--trade-target); }
  .conf-fill.conf-marginal { background: var(--status-warning); }
  .conf-fill.conf-poor     { background: var(--trade-stop); }
  .conf-why { margin: 9px 0 0; padding-left: 16px; font-size: 12px; color: var(--text-secondary); }
  .conf-why li { margin-bottom: 3px; }

  .ev-clears { color: var(--trade-target); font-weight: 700; }
  .ev-weak   { color: var(--status-warning); font-weight: 600; }
  .ev-none   { color: var(--trade-stop); font-weight: 700; }
  tr.ev-now td { background: var(--warn-soft); }
  .ev-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--status-warning); border: 1px solid color-mix(in srgb, var(--status-warning) 45%, var(--border));
    border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  .tgt { font-size: 12.5px; }
  .tgt td, .tgt th { padding: 5px 8px; }
  .checks { margin: 6px 0 0; padding-left: 20px; font-size: 13.5px; color: var(--text-secondary); }
  .checks li { margin-bottom: 8px; }
  .checks b { color: var(--text-primary); }

  /* Long vs short, side by side — the comparison is the point. */
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .sides { grid-template-columns: 1fr; } }
  .side { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--surface-1); }
  .side.roomy { border-color: color-mix(in srgb, var(--bar-flag) 50%, var(--border)); }
  .side-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .side-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 600; }
  .side-tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--bar-flag); border: 1px solid color-mix(in srgb, var(--bar-flag) 45%, var(--border));
    border-radius: 999px; padding: 2px 8px; }
  .side-air { display: flex; align-items: baseline; gap: 7px; }
  .air-n { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .air-u { font-size: 12px; color: var(--text-muted); }
  .side-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; }
  .side-sub b { color: var(--text-primary); }
  .side-tbl { margin-top: 10px; font-size: 12px; }
  .side-tbl td { padding: 3px 6px; border-bottom: none; }

  .conc { margin-top: 16px; }
  .conc-head { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 10px; }
  .cmp-bar.hot { background: var(--bar-flag); }
  .conc .cmp-bar { background: var(--bar-plain); }
  .conc .cmp-bar.hot { background: var(--bar-flag); }

  .claims { margin-top: 22px; }
  .claims p { margin: 4px 0 16px; color: var(--text-secondary); font-size: 13.5px; max-width: 80ch; }
  .claims p:last-child { margin-bottom: 0; }
  .claims b { color: var(--text-primary); }
  .verdict-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); }
  .verdict-chip.holds { color: var(--status-good);
    border-color: color-mix(in srgb, var(--status-good) 45%, var(--border)); }
  .verdict-chip.fails { color: var(--text-muted); }

  /* Order plan — the translation layer between the read and the platform. */
  .plan { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .plan-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                color: var(--text-muted); margin-bottom: 10px; }
  .plan-steps { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--text-secondary); }
  .plan-steps li { margin-bottom: 6px; }
  .plan-steps b { color: var(--text-primary); }
  .plan-size { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 14px; }
  .sz { display: flex; align-items: baseline; gap: 7px; }
  .szn { font-size: 25px; font-weight: 600; letter-spacing: -.02em; }
  .szl { font-size: 12px; color: var(--text-muted); }

  /* Bracket header — the two numbers acted on, plus the Stretch behind them. */
  .orb-head { display: flex; gap: 34px; flex-wrap: wrap; align-items: flex-end; margin: 4px 0 18px; }
  .stop { display: flex; flex-direction: column; }
  .stop .k { color: var(--text-muted); font-size: 12px; }
  .stop .v { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .stop .sub { color: var(--text-muted); font-size: 11.5px; margin-top: 1px; }
  .stop.hero-stretch { margin-left: auto; text-align: right; }
  .stop.hero-stretch .v { font-size: 50px; }

  /* Cohort-vs-baseline comparison rows. */
  .cmp-block { margin-top: 14px; }
  .cmp-head { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
  .cmp-head b { color: var(--text-primary); }
  .cmp-key { float: right; color: var(--text-muted); font-size: 11.5px; }
  .cmp { display: grid; grid-template-columns: 190px 1fr 130px; align-items: center; gap: 12px; margin-bottom: 9px; }
  .cmp-label { font-size: 12.5px; color: var(--text-secondary); }
  .cmp-track { position: relative; height: 16px; background: color-mix(in srgb, var(--text-primary) 6%, transparent); border-radius: 4px; }
  .cmp-bar { height: 100%; background: var(--bar-flag); border-radius: 4px; }
  /* Baseline is a marker, not a second bar — it is a reference, not a rival. */
  .cmp-bar + .cmp-base { position: absolute; top: -3px; width: 2px; height: 22px; background: var(--text-muted); }
  .cmp-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cmp-vs { display: block; font-size: 11px; font-weight: 400; color: var(--text-muted); }

  details { border-top: 1px solid var(--border); padding-top: 12px; }
  details.panel { border: 1px solid var(--border); padding: 14px 18px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); list-style-position: outside; }
  summary:hover { color: var(--text-primary); }
  summary::marker { color: var(--text-muted); }

  .legend i.ghost { background: var(--bar-plain); opacity: .35; box-shadow: inset 0 0 0 1px var(--bar-flag); }
  .sig-label { font-size: 11.5px; }
  /* Refetch holds the previous render rather than flashing — no layout jump. */
  .pane { transition: opacity .12s; }
  .pane.refreshing { opacity: .72; }

  /* Tabs read as a route through the work: act, then why, then the document.
     Numbered so the order is a sequence rather than a menu. */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tabs button {
    appearance: none; background: none; border: none; cursor: pointer;
    font: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-muted);
    padding: 10px 16px; border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: inline-flex; align-items: baseline; gap: 8px; transition: color .12s;
  }
  .tabs button .tnum { font-size: 10.5px; font-weight: 700; opacity: .5; }
  .tabs button:hover { color: var(--text-secondary); }
  .tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--trade-entry); }
  .tabs button[aria-selected="true"] .tnum { opacity: 1; color: var(--trade-entry); }
  .tabs .spacer { flex: 1; }
  .pane[hidden] { display: none; }

  .cheat h3 { font-size: 13px; font-weight: 600; margin: 0 0 3px; }
  .cheat p { margin: 0 0 10px; color: var(--text-secondary); font-size: 13.5px; }
  .cheat p:last-child { margin-bottom: 0; }
  .cheat code {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px;
    background: color-mix(in srgb, var(--text-primary) 7%, transparent);
    padding: 1.5px 5px; border-radius: 4px;
  }
  .cheat .formula {
    display: block; padding: 11px 13px; margin: 8px 0 12px; border-radius: 7px;
    background: color-mix(in srgb, var(--text-primary) 5%, transparent);
    border-left: 3px solid var(--bar-flag);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px;
    color: var(--text-primary); line-height: 1.6;
    white-space: pre-wrap;   /* the formulas are written as multi-line source */
    overflow-x: auto;
  }
  .cheat table { margin-top: 4px; }
  .cheat td:first-child { font-weight: 600; white-space: nowrap; }
  .cheat .def td:not(:first-child) { text-align: left; color: var(--text-secondary); }
  .live-val { color: var(--bar-flag); font-weight: 600; }
  /* Marks a figure that clears two standard errors of its baseline. Paired with
     the sigma value beside it, so significance is never colour-only. */
  .sig { color: var(--text-primary); font-weight: 700; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ocean's Crabel</h1>
    <span class="sub" id="sub">loading…</span>
    <span class="live"><span class="clock" id="clock">—</span>
      <a class="alertbtn pdfbtn" id="pdfbtn" href="/brief.pdf" download>download PDF</a>
      <button class="alertbtn" id="alertbtn" type="button">enable alerts</button>
      <span class="dot" id="dot"></span><span id="updated">—</span></span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="trade" aria-selected="true"><span class="tnum">01</span>Plan</button>
    <button role="tab" data-tab="live" aria-selected="false"><span class="tnum">02</span>Evidence</button>
    <button role="tab" data-tab="watch" aria-selected="false"><span class="tnum">03</span>Watch</button>
    <button role="tab" data-tab="brief" aria-selected="false"><span class="tnum">04</span>Brief</button>
    <button role="tab" data-tab="cheat" aria-selected="false"><span class="tnum">05</span>Method</button>
  </nav>

  <div id="stalebar" hidden></div>
  <div id="zonestrip"></div>
  <div class="pane" id="pane-live"></div>
  <div class="pane" id="pane-trade" hidden></div>
  <div class="pane" id="pane-watch" hidden></div>
  <div class="pane" id="pane-brief" hidden></div>
  <div class="pane cheat" id="pane-cheat" hidden></div>
</div>

<div class="tip" id="tip"></div>

<script type="module">
// ?theme=dark / ?theme=light pins the theme; without it the page follows the OS.
const forced = new URLSearchParams(location.search).get('theme');
if (forced === 'dark' || forced === 'light') document.documentElement.dataset.theme = forced;

const $ = (s) => document.querySelector(s);
const app = $('#pane-live'), cheat = $('#pane-cheat'), tip = $('#tip');

// Tab state lives outside render() so the 5-second refresh never yanks you back
// to the live pane while you are reading the cheat sheet.
// Which direction the trade tab is showing. ?side= wins so a view can be linked;
// otherwise the last choice persists across reloads.
const sideParam = new URLSearchParams(location.search).get('side');
let tradeSide = sideParam === 'short' || sideParam === 'long'
  ? sideParam
  : (localStorage.getItem('oceans-crabel-side') === 'short' ? 'short' : 'long');

// Plan first: the tool exists to answer "what do I do", not "what happened".
const TABS = ['trade', 'live', 'watch', 'brief', 'cheat'];
let activeTab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'trade';

function applyTab() {
  document.querySelectorAll('.tabs button').forEach((b) => {
    const on = b.dataset.tab === activeTab;
    b.setAttribute('aria-selected', String(on));
  });
  $('#pane-live').hidden = activeTab !== 'live';
  $('#pane-trade').hidden = activeTab !== 'trade';
  $('#pane-watch').hidden = activeTab !== 'watch';
  $('#pane-brief').hidden = activeTab !== 'brief';
  $('#pane-cheat').hidden = activeTab !== 'cheat';
}

document.querySelectorAll('.tabs button').forEach((b) => {
  b.addEventListener('click', () => {
    activeTab = b.dataset.tab;
    history.replaceState(null, '', activeTab === 'trade' ? '#' : `#${activeTab}`);
    applyTab();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

const n1 = (v) => v == null ? '—' : v.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const n0 = (v) => v == null ? '—' : Math.round(v).toLocaleString('en-US');

// A null flag means "not enough history", which is not the same as "no".
function chip(name, val) {
  if (val === null || val === undefined) return `<span class="chip unknown" title="not enough history to evaluate">${name} —</span>`;
  return val ? `<span class="chip on">${name}</span>` : `<span class="chip">${name}</span>`;
}

function sourceBanner(d) {
  const m = d.meta;
  const live = m.sessionInProgress;
  const rejected = m.rejectedSessions?.length ?? 0;

  const why = [
    `${d.sessionCount} complete sessions, ${m.barsPerSession ?? '—'} bars each`,
    live
      ? `<b>session in progress</b> — bracket is anchored to today's 8:30 CT open`
      : 'no session in progress — bracket is provisional off the last RTH close',
    rejected
      ? `${rejected} session${rejected === 1 ? '' : 's'} excluded for not starting at 08:30 CT`
      : 'every session started cleanly at 08:30 CT',
  ].join(' · ');

  return `<div class="source">
    <span class="icon">●</span>
    <div><b>RTH — tradable</b> · ${m.label}
    <span class="why">${why}</span></div>
  </div>`;
}

function barChart(rows, projection) {
  const W = 1000, H = 215, padB = 30, padT = 22, padR = 96;
  const proj = projection?.available ? projection : null;

  // The 20-session average is the bar every base rate is quoted against, so it
  // belongs on the chart rather than only in prose.
  const recent = rows.slice(-20).map(r => r.range);
  const avg20 = recent.reduce((a, b) => a + b, 0) / recent.length;

  const max = Math.max(...rows.map(r => r.range), avg20, proj ? proj.p75 : 0);
  const plotW = W - padR;
  const slots = rows.length + (proj ? 1 : 0);
  const band = plotW / slots;
  const bw = Math.min(24, band - 2);           // cap thickness; 2px surface gap
  const y = (v) => padT + (H - padT - padB) * (1 - v / max);

  const bars = rows.map((r, i) => {
    const x = i * band + (band - bw) / 2;
    const yy = y(r.range), h = H - padB - yy;
    const fill = r.nr7 === true ? 'var(--bar-flag)' : 'var(--bar-plain)';
    const rr = Math.min(4, h);
    const d = `M${x},${H - padB} L${x},${yy + rr} Q${x},${yy} ${x + rr},${yy} L${x + bw - rr},${yy} Q${x + bw},${yy} ${x + bw},${yy + rr} L${x + bw},${H - padB} Z`;
    return `<path d="${d}" fill="${fill}" data-i="${i}"/>`;
  }).join('');

  // Forward slot: where the next session's range is projected to land, drawn as
  // an outline so it never reads as an observation.
  let ghost = '';
  if (proj) {
    const i = rows.length;
    const x = i * band + (band - bw) / 2;
    ghost = `
      <rect x="${x}" y="${y(proj.p75)}" width="${bw}" height="${y(proj.p25) - y(proj.p75)}"
            fill="var(--bar-plain)" opacity="0.28" rx="3"/>
      <line x1="${x - 2}" y1="${y(proj.median)}" x2="${x + bw + 2}" y2="${y(proj.median)}"
            stroke="var(--bar-flag)" stroke-width="2"/>
      <text class="axis" x="${x + bw / 2}" y="${H - padB + 14}" text-anchor="middle">next</text>`;
  }

  const lastI = rows.length - 1;
  const ticks = rows.map((r, i) => {
    const periodic = i % 3 === 0 && lastI - i > 1;
    if (!periodic && i !== lastI) return '';
    return `<text class="axis" x="${i * band + band / 2}" y="${H - padB + 14}" text-anchor="middle">${r.date.slice(5)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" id="chart" role="img" aria-label="Session ranges with NR7 sessions emphasised">
    <line x1="0" y1="${y(avg20)}" x2="${plotW}" y2="${y(avg20)}" stroke="var(--baseline)" stroke-width="1"/>
    <text class="axis" x="${plotW + 10}" y="${y(avg20) + 4}" style="font-size:11px">20-session avg ${n0(avg20)}</text>
    <line x1="0" y1="${H - padB}" x2="${plotW}" y2="${H - padB}" stroke="var(--baseline)" stroke-width="1"/>
    ${bars}${ghost}${ticks}
  </svg>`;
}

/**
 * One price axis, three intervals stacked on it, brackets drawn through all of
 * them. Identity comes from the row label, so every bar wears the same hue and
 * no legend is needed — the accent is reserved for the two lines you act on.
 */
function priceMap(d) {
  const { orb, expectedMove: em, projection: pj, last } = d;
  if (!orb?.available) return '';

  const ref = orb.reference;
  const rows = [
    { key: 'prior', label: `${last.date} RTH range`, lo: last.low, hi: last.high,
      note: `${n0(last.range)} pts` },
  ];
  if (pj?.available) {
    rows.push({ key: 'proj', label: 'Projected next session', lo: ref - pj.median / 2, hi: ref + pj.median / 2,
      spreadLo: ref - pj.p75 / 2, spreadHi: ref + pj.p75 / 2, note: `${n0(pj.median)} pts median` });
  }
  if (em?.available) {
    rows.push({ key: 'em', label: 'Expected move ±1σ', lo: em.lower, hi: em.upper,
      note: `±${n0(em.points)} pts` });
  }

  const W = 1000, LEFT = 186, RIGHT = W - 96, ROW_H = 42, TOP = 16;
  const H = TOP + rows.length * ROW_H + 42;

  const all = rows.flatMap(r => [r.lo, r.hi, r.spreadLo, r.spreadHi]).filter(v => v != null)
    .concat([orb.buyStop, orb.sellStop, ref]);
  const lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.06 || 1;
  const x = (v) => LEFT + ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * (RIGHT - LEFT);

  const BAR = 15;
  const bars = rows.map((r, i) => {
    const y = TOP + i * ROW_H;
    const spread = r.spreadLo != null
      ? `<rect x="${x(r.spreadLo)}" y="${y + 4}" width="${x(r.spreadHi) - x(r.spreadLo)}" height="${BAR}"
               rx="4" fill="var(--bar-plain)" opacity="0.22"/>`
      : '';
    return `${spread}
      <rect x="${x(r.lo)}" y="${y + 4}" width="${Math.max(2, x(r.hi) - x(r.lo))}" height="${BAR}"
            rx="4" fill="var(--bar-plain)" opacity="0.62"/>
      <text class="axis" x="${LEFT - 14}" y="${y + 16}" text-anchor="end" style="font-size:11.5px">${r.label}</text>
      <text class="axis" x="${RIGHT + 12}" y="${y + 16}" style="font-size:11px">${r.note}</text>`;
  }).join('');

  // Gamma levels as ticks on the same price axis. Drawn behind the brackets so
  // the two lines you act on stay dominant.
  const g = d.gamma;
  const gammaTicks = g?.available
    ? g.map.filter((l) => l.value >= lo - pad && l.value <= hi + pad).map((l) => {
        const major = /Gamma Wall|Call Resistance|Put Support|HVL/i.test(l.name);
        return `<line x1="${x(l.value)}" y1="${TOP - 4}" x2="${x(l.value)}" y2="${TOP + rows.length * ROW_H}"
                  stroke="var(--text-muted)" stroke-width="${major ? 1.5 : 1}"
                  opacity="${major ? 0.55 : 0.22}"><title>${l.name} · ${n1(l.value)}</title></line>`;
      }).join('')
    : '';

  const bracketTop = TOP, bracketBot = TOP + rows.length * ROW_H + 2;
  const mark = (v, label) => `
    <line x1="${x(v)}" y1="${bracketTop}" x2="${x(v)}" y2="${bracketBot}" stroke="var(--bar-flag)" stroke-width="2"/>
    <text class="axis sig-label" x="${x(v)}" y="${bracketBot + 15}" text-anchor="middle">${label}</text>
    <text class="axis" x="${x(v)}" y="${bracketBot + 29}" text-anchor="middle" style="font-size:11px">${n1(v)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price map of brackets against prior range, projection and expected move">
    ${gammaTicks}
    <line x1="${x(ref)}" y1="${bracketTop - 6}" x2="${x(ref)}" y2="${bracketBot}" stroke="var(--baseline)" stroke-width="1"/>
    ${bars}
    ${mark(orb.sellStop, 'sell stop')}
    ${mark(orb.buyStop, 'buy stop')}
  </svg>`;
}

function pct(v, digits = 0) {
  return v == null ? '—' : (v * 100).toFixed(digits) + '%';
}

/**
 * Does this cohort's direction differ from the market's own drift?
 *
 * Measured against the baseline up-close rate, NOT against 50%. Equities close
 * up more often than they close down, so a coin-flip yardstick would credit a
 * setup for the market's general rise and manufacture an edge that isn't there.
 */
function directionDiffers(cohort, baselineRate) {
  if (!cohort || baselineRate == null || cohort.upCloseStdErr == null) return false;
  return Math.abs(cohort.upCloseRate - baselineRate) >= 2 * cohort.upCloseStdErr;
}

/**
 * The one-paragraph answer. Everything else on this tab is evidence for it, and
 * a trader glancing pre-market should be able to stop reading here.
 */
function synthesis(d) {
  const L = d.last, pj = d.projection, st = d.stats;
  const q = st?.available ? (st.current.insufficient ? st.nearestUsable : st.current) : null;
  const parts = [];

  if (pj?.available) {
    const vsPrior = pj.median > L.range ? 'wider than' : 'narrower than';
    parts.push(`Expect roughly <b>${n0(pj.median)} points</b>, ${vsPrior} ${L.date.slice(5)}'s ${n0(L.range)}`);
  }
  if (q && st.baseline && q.expansionRate < st.baseline.expansionRate) {
    parts.push(`still below the 20-session average more often than not (${pct(q.expansionRate)} beat it, vs ${pct(st.baseline.expansionRate)} normally)`);
  } else if (q) {
    parts.push(`${pct(q.expansionRate)} of these beat the 20-session average`);
  }

  const differs = q && directionDiffers(q, st.baseline?.upCloseRate);
  parts.push(!q ? ''
    : differs
      ? `direction leans ${q.upCloseRate > st.baseline.upCloseRate ? 'up' : 'down'} — ${pct(q.upCloseRate)} vs ${pct(st.baseline.upCloseRate)} normally`
      : 'no directional edge beyond the market\'s usual drift — <b>bracket both sides</b>');

  // Each clause is written to stand alone, so sentence-case them on the way out
  // rather than authoring three variants of every fragment.
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  let out = parts.filter(Boolean).map(cap).join('. ') + '.';

  // The headline names the setup you are actually in. When that setup is too rare
  // to quote, every number above it came from a different, broader cohort — and a
  // figure printed under the wrong label is the one failure mode that discredits
  // the rest of the page. Say whose numbers these are, in the same breath.
  if (st?.available && st.current.insufficient && st.nearestUsable) {
    out += ` <b>These figures are not ${st.current.label}'s.</b> That setup has only
      ${st.current.n} occurrence${st.current.n === 1 ? '' : 's'} here — too few to quote — so the numbers above
      are the broader <b>${st.nearestUsable.label}</b> cohort (n=${st.nearestUsable.n}). The rarity is itself
      the finding: you are in a setup the sample cannot price.`;
  }
  return out;
}

// Contract sizing. Prices come from NQ=F, but every dollar figure on this page
// is MNQ. The two differ by 10x, so the instrument is stated wherever money is,
// never left to be inferred from the NQ=F in the header.
const CONTRACT = { symbol: 'MNQ', pointValue: 2.0, tickValue: 0.5, tick: 0.25 };
const MNQ_PT = CONTRACT.pointValue;
const usd = (pts) => `$${(pts * CONTRACT.pointValue).toLocaleString('en-US', { maximumFractionDigits: 0 })}`;
/** The same points on the E-mini, for contrast — the mistake worth preventing. */
const usdEmini = (pts) => `$${(pts * 20).toLocaleString('en-US', { maximumFractionDigits: 0 })}`;

/** 1st, 2nd, 3rd, 52nd — "52th" was reaching the page. */
function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] ?? s[v] ?? s[0]);
}

const until = (epoch) => {
  const m = Math.max(0, Math.round((epoch - Date.now()) / 60000));
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ${String(m % 60).padStart(2, '0')}m` : `${Math.floor(h / 24)}d ${h % 24}h`;
};

const IMPACT_ORDER = { High: 3, Medium: 2, Low: 1, Holiday: 0 };

const toMin = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };

// Houston runs on Central. The exchange defines its session in ET, so times are
// computed in ET and displayed in CT. Both zones shift for DST on the same dates,
// so the gap is a constant hour.
const ct = (hm) => {
  const t = (toMin(hm) - 60 + 1440) % 1440;
  return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
};
/** Central time-of-day now, in minutes past midnight. */
function ctNowMinutes() {
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Chicago' }));
  return d.getHours() * 60 + d.getMinutes();
}
const dayName = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

/** Concentration of the opening window, used in prose above the roadmap. */
const zones0 = (d) => d.meta?.zones?.zones?.[0]?.concentration ?? null;

/** Current ET time-of-day in minutes. */
function etNowMinutes() {
  const et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  return et.getHours() * 60 + et.getMinutes();
}

function etNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
}

// The full 24-hour cycle, gapless, so "what's next" always has an answer.
// Asia wraps midnight and is handled as a single window rather than split.
const ZONE_SEQ = [
  { key: 'asia',   label: 'Asia',                from: '20:00', to: '02:00' },
  { key: 'euPos',  label: 'Europe positioning',  from: '02:00', to: '05:00' },
  { key: 'euCont', label: 'Europe continuation', from: '05:00', to: '07:00' },
  { key: 'premkt', label: 'NY premarket',        from: '07:00', to: '09:30' },
  { key: 'nyOpen', label: 'NY open / repricing', from: '09:30', to: '10:00' },
  { key: 'amRev',  label: 'AM reversal zone',    from: '10:00', to: '11:00' },
  { key: 'lateAm', label: 'Late morning',        from: '11:00', to: '12:00' },
  { key: 'lunch',  label: 'Lunch',               from: '12:00', to: '13:00' },
  { key: 'pm',     label: 'PM trend',            from: '13:00', to: '15:00' },
  { key: 'close',  label: 'Close',               from: '15:00', to: '16:00' },
  { key: 'post',   label: 'Post-close',          from: '16:00', to: '20:00' },
];

const hhmm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
// Every chart positions marks by ET minutes, because ET is what defines the
// session. These two only relabel — they never move anything. Use them for any
// tick, tooltip, or caption a person reads.
const hhmmCt = (m) => hhmm((m - 60 + 1440) % 1440);
/** An ET range as it reads in Houston: "09:30–10:00" -> "08:30–09:00". */
const ctRange = (from, to) => `${ct(from)}–${ct(to)}`;
const countdown = (m) => m >= 1440
  ? `${Math.floor(m / 1440)}d ${Math.floor((m % 1440) / 60)}h`
  : m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`;

/**
 * Where we are in the 24-hour cycle and what is next.
 *
 * Over the weekend the zones are meaningless — Globex is shut — so rather than
 * counting down to an "Asia session" that will not happen, it counts down to the
 * Sunday 18:00 ET reopen and says the market is closed.
 */
function zoneSchedule() {
  const et = etNow();
  const nowM = et.getHours() * 60 + et.getMinutes();
  const dow = et.getDay();
  const REOPEN = 18 * 60;

  const closed =
    dow === 6 ||                                  // all Saturday
    (dow === 0 && nowM < REOPEN) ||               // Sunday before the reopen
    (dow === 5 && nowM >= 17 * 60);               // Friday after the 17:00 close

  if (closed) {
    let days = dow === 5 ? 2 : dow === 6 ? 1 : 0;
    const mins = days * 1440 - nowM + REOPEN;
    return { closed: true, reopenIn: Math.max(0, mins), zones: [] };
  }

  const inZone = (z) => {
    const a = toMin(z.from), b = toMin(z.to);
    return a < b ? nowM >= a && nowM < b : nowM >= a || nowM < b;   // wrap-aware
  };

  const zones = ZONE_SEQ.map((z) => {
    const a = toMin(z.from), b = toMin(z.to);
    const active = inZone(z);
    const startsIn = (a - nowM + 1440) % 1440;
    const endsIn = (b - nowM + 1440) % 1440;
    return { ...z, active, startsIn, endsIn };
  });

  const current = zones.find((z) => z.active) ?? null;
  const upcoming = zones.filter((z) => !z.active).sort((a, b) => a.startsIn - b.startsIn);

  return { closed: false, current, upcoming, zones };
}

/** The countdown strip. Text only, so it can tick without re-rendering the page. */
function zoneStripHtml(measured) {
  const s = zoneSchedule();
  const conc = new Map((measured?.zones ?? []).map((z) => [z.key, z.concentration]));

  if (s.closed) {
    return `<div class="zstrip closed">
      <span class="z-now">Market closed</span>
      <span class="z-sub">Globex reopens in <b>${countdown(s.reopenIn)}</b> · Sunday 17:00 CT</span>
    </div>`;
  }

  const chip = (z) => {
    const c = conc.get(z.key);
    const hot = c != null && c >= 1.5;
    return `<span class="zchip${z.active ? ' active' : ''}${hot ? ' hot' : ''}" title="${ctRange(z.from, z.to)} CT${
      c != null ? ` · ${c.toFixed(2)}× extreme concentration` : ''}">
      <span class="zc-label">${z.label}</span>
      <span class="zc-row">
        <span class="zc-time">${z.active ? `${countdown(z.endsIn)} left` : `in ${countdown(z.startsIn)}`}</span>
        ${c != null ? `<span class="zc-conc">${c.toFixed(1)}×</span>` : ''}
      </span>
    </span>`;
  };

  const order = s.current ? [s.current, ...s.upcoming] : s.upcoming;
  return `<div class="zstrip">${order.slice(0, 6).map(chip).join('')}</div>`;
}

/**
 * Session structure, measured rather than asserted.
 *
 * The zone names come from how the day is commonly traded; the percentages come
 * from this instrument's own sessions. Where the two disagree, the panel says so
 * — that is the entire point of putting numbers on it.
 */
/**
 * The mirrored intraday profile, extracted so the brief can print the same
 * chart the Evidence tab shows rather than a second, drifting copy.
 */
function zoneProfileSvg(z) {
  const prof = z.profile ?? [];
  const W = 1000, LEFT = 52, RIGHT = W - 12;
  const ZONEBAR = 20, AX = 150, ARM = 96, PAD_T = 26;
  const H = PAD_T + ZONEBAR + 8 + ARM * 2 + 34;
  const t0 = toMin('09:30'), t1 = toMin('16:00');
  const x = (hm) => LEFT + ((toMin(hm) - t0) / (t1 - t0)) * (RIGHT - LEFT);

  const nowM = etNowMinutes();
  // Clock time inside RTH is not enough — on a Sunday afternoon it is 12:08 in
  // New York and the market is shut. Drawing "now" on a session that is not
  // running implies a live read that does not exist.
  const nowIn = nowM >= t0 && nowM < t1 && !zoneSchedule().closed;
  const axisY = PAD_T + ZONEBAR + 8 + ARM;

  // Mirrored profile: highs grow up from the time axis, lows grow down. One
  // shared clock, so the shape of the day reads directly — the two arms are
  // the same measure on opposite sides, not two competing series.
  const peak = Math.max(...prof.flatMap((p) => [p.highPct, p.lowPct]), 0.02);
  const bw = prof.length ? ((RIGHT - LEFT) / prof.length) - 3 : 0;

  const bars2 = prof.map((p, i) => {
    const xa = LEFT + i * ((RIGHT - LEFT) / prof.length) + 1.5;
    const hh = (p.highPct / peak) * ARM;
    const lh = (p.lowPct / peak) * ARM;
    const hot = p.concentration >= 2;
    const fill = hot ? 'var(--bar-flag)' : 'var(--bar-plain)';
    return `
      <rect x="${xa}" y="${axisY - hh}" width="${bw}" height="${Math.max(0.8, hh)}" rx="3" fill="${fill}" opacity="0.9"/>
      <rect x="${xa}" y="${axisY}" width="${bw}" height="${Math.max(0.8, lh)}" rx="3" fill="${fill}" opacity="0.5"/>
      <rect class="hitzone" x="${xa - 1.5}" y="${PAD_T}" width="${bw + 3}" height="${ARM * 2 + 20}"
            fill="transparent" data-b="${i}"/>`;
  }).join('');

  // The named windows ride above the profile so the framework stays legible
  // without the labels fighting the data for space.
  const zbands = z.zones.map((zz) => {
    const xa = x(zz.from), xb = x(zz.to), w = xb - xa;
    const hot = zz.concentration >= 1.5;
    // Pick the longest label that actually fits: a clipped zone name is worse
    // than a short one, and worse still than just the multiplier.
    const fs = w < 100 ? 9 : 10;
    const fits = (s) => s.length * fs * 0.56 < w - 8;
    const text = fits(zz.label) ? zz.label
      : fits(zz.short) ? zz.short
      : fits(zz.concentration.toFixed(1) + '×') ? zz.concentration.toFixed(1) + '×' : '';
    return `
      <rect x="${xa + 1}" y="${PAD_T}" width="${Math.max(2, w - 2)}" height="${ZONEBAR}" rx="4"
            fill="${hot ? 'var(--bar-flag)' : 'var(--bar-plain)'}" opacity="${hot ? 0.5 : 0.22}"/>
      <title>${zz.label} · ${ctRange(zz.from, zz.to)} CT · ${zz.concentration.toFixed(2)}×</title>
      <text class="axis" x="${(xa + xb) / 2}" y="${PAD_T + 14}" text-anchor="middle"
            style="font-size:${fs}px">${text}</text>`;
  }).join('');

  // Placed at their ET position, labelled in CT.
  const ticks = ['09:30', '10:30', '11:30', '12:30', '13:30', '14:30', '15:30'].map((t) =>
    `<text class="axis" x="${x(t)}" y="${axisY + 15}" text-anchor="middle" style="font-size:10px">${ct(t)}</text>`).join('');

  const nowMark = nowIn ? `
    <line x1="${x(hhmm(nowM))}" y1="${PAD_T}" x2="${x(hhmm(nowM))}" y2="${axisY + ARM}"
          stroke="var(--trade-target)" stroke-width="2"/>
    <text class="axis" x="${x(hhmm(nowM))}" y="${PAD_T - 6}" text-anchor="middle"
          style="font-size:10px;fill:var(--status-good)">now</text>` : '';

  return `<svg viewBox="0 0 ${W} ${H}" id="profile"
       role="img" aria-label="Intraday profile: when session highs and lows form, in 30-minute buckets">
      ${zbands}
      <line x1="${LEFT}" y1="${axisY}" x2="${RIGHT}" y2="${axisY}" stroke="var(--baseline)" stroke-width="1"/>
      ${bars2}
      <text class="axis" x="${LEFT - 8}" y="${axisY - ARM + 10}" text-anchor="end" style="font-size:10.5px">highs</text>
      <text class="axis" x="${LEFT - 8}" y="${axisY + ARM - 2}" text-anchor="end" style="font-size:10.5px">lows</text>
      ${ticks}${nowMark}
    </svg>`;
}

function zonePanel(z) {
  if (!z?.available) {
    return `<div class="panel"><h2>Session map</h2>
      <p class="hint" style="margin:0">Unavailable — ${z?.reason ?? 'no intraday data'}</p></div>`;
  }
  const f = z.findings, prof = z.profile ?? [];
  const claim = (verdict, ok) =>
    `<span class="verdict-chip ${ok ? 'holds' : 'fails'}">${ok ? '✓' : '✕'} ${verdict}</span>`;

  return `<div class="panel">
    <h2>Session map — where the day's extremes actually form</h2>
    <p class="hint">Measured on <b>${z.sessions.toLocaleString()}</b> complete RTH sessions ·
      ${z.sampleSource}.</p>

    ${zoneProfileSvg(z)}
    <p class="hint" style="margin:2px 0 0">Each bar is a ${z.bucketMinutes}-minute window; above the line
      are session highs, below are lows. Every session contributes one high and one low, so the two arms
      each total 100% — a bucket's share of <em>all</em> extremes is the average of its two bars.
      The opening ${z.bucketMinutes} minutes alone holds
      <b>${pct(((prof[0]?.highPct ?? 0) + (prof[0]?.lowPct ?? 0)) / 2, 0)}</b> of them, and the closing
      ${z.bucketMinutes} another
      <b>${pct(((prof.at(-1)?.highPct ?? 0) + (prof.at(-1)?.lowPct ?? 0)) / 2, 0)}</b>.
      Hover any bar for its numbers.</p>

    <div class="conc">
      <div class="conc-head">Concentration — extremes formed vs the share of the clock each window owns.
        <span class="muted">1.0× = no better than chance</span></div>
      ${z.zones.slice().sort((a, b) => b.concentration - a.concentration).map((zz) => {
        const c = zz.concentration;
        const w = Math.min(100, (c / 4) * 100);
        return `<div class="cmp">
          <div class="cmp-label">${zz.label} <span class="muted">${zz.minutes}m</span></div>
          <div class="cmp-track">
            <div class="cmp-bar${c >= 1.5 ? ' hot' : ''}" style="width:${Math.max(1.5, w)}%"></div>
            <div class="cmp-base" style="left:25%" title="1.0x = chance"></div>
          </div>
          <div class="cmp-val">${c.toFixed(2)}×<span class="cmp-vs">${pct(zz.extremePct)} of extremes</span></div>
        </div>`;
      }).join('')}
    </div>

    <div class="claims">
      ${claim('First hour defines the day', true)}
      <p><b>${pct(f.earlyExtremeRate)}</b> of sessions place <em>at least one</em> of their two extremes
        before 09:30 CT — counted once per session, not the sum of the two shares.
        Only ${pct(f.bothEarlyRate)} put <em>both</em> there, which is why the figure is far below the
        ${pct((f.earlyExtremeRate + f.bothEarlyRate))} you would get by adding them. The
        <b>${z.zones[0].label.toLowerCase()}</b> window owns only ${pct(z.zones[0].expectedPct)} of the
        clock but produces <b>${pct(z.zones[0].extremePct)}</b> of all extremes —
        <b>${z.zones[0].concentration.toFixed(1)}× chance</b>. That concentration is the strongest
        thing in the map, and it is why the ORB bracket belongs at the open rather than later.</p>

      ${claim('Opening move is a Judas trap', false)}
      <p>The first 30 minutes points <em>opposite</em> to the session only <b>${pct(f.judasRate)}</b>
        of the time (n=${f.judasN}), so it <b>continues about ${pct(1 - f.judasRate)}</b> of the time.
        ${f.judasSignificant
          ? 'That is significantly below a coin flip — on this instrument the opening move persists more often than it traps.'
          : 'That is within noise of a coin flip on this sample.'}
        ${f.judasExcluded ? `<span class="muted">(${f.judasExcluded} sessions closed exactly flat over one
          leg or the other and carry no direction, so they are excluded — hence n=${f.judasN} against
          ${z.sessions.toLocaleString()} sessions.)</span>` : ''}
        Treating the open as a default trap would have you fading the more likely direction.</p>

      ${claim('Premarket liquidity gets engineered', false)}
      <p>True but useless as a signal: RTH runs the premarket high or low in <b>${pct(f.sweptEitherRate)}</b>
        of sessions (high ${pct(f.sweptHighRate)}, low ${pct(f.sweptLowRate)}). Something that happens
        almost every session cannot discriminate between them — same problem as the 99% bracket-touch
        rate on Globex bars. <span class="muted">Measured on ${z.premarketSessions} sessions from the
        NQ=F 5-minute feed, which is fetched with pre-market bars included — the 78-bars-per-session
        figure quoted elsewhere counts RTH bars only. The deep NAS100 history is RTH-only and cannot
        answer this question at all.</span></p>
    </div>
  </div>`;
}

/**
 * Scheduled catalysts. Compression tells you a move is stored up; the calendar
 * tells you what might release it and when.
 */
function eventsPanel(cal) {
  if (!cal?.available) {
    return `<div class="panel"><h2>Scheduled events</h2>
      <p class="hint" style="margin:0">Unavailable — ${cal?.reason ?? 'no calendar source'}</p></div>`;
  }

  const body = cal.exhausted
    ? `<div class="callout">No events left in this feed. ForexFactory publishes a
         <b>current-week</b> file only — there is no next-week endpoint — so once the week's
         releases have passed it is empty until the new file appears. This is a limit of the
         feed, not a quiet week.</div>`
    : `${cal.nextHigh ? `
        <div class="ev-hero ev-${cal.nextHigh.window}">
          <div class="ev-when">
            <span class="ev-count">${until(cal.nextHigh.epoch)}</span>
            <span class="ev-time">${cal.nextHigh.ctTime ?? ct(cal.nextHigh.etTime)} CT · ${cal.nextHigh.window.replace('-', ' ')}</span>
          </div>
          <div class="ev-what">
            <span class="ev-impact">High impact</span>
            <span class="ev-title">${cal.nextHigh.title}</span>
            ${cal.nextHigh.forecast ? `<span class="ev-meta">forecast ${cal.nextHigh.forecast}${
              cal.nextHigh.previous ? ` · previous ${cal.nextHigh.previous}` : ''}</span>` : ''}
          </div>
        </div>
        ${cal.nextHigh.window === 'in-session'
          ? `<p class="hint" style="margin:10px 0 0"><b>This lands mid-session.</b> A bracket touched
             before it is a different trade from one touched after — the release, not the pattern,
             is driving the second one.</p>`
          : cal.nextHigh.window === 'pre-open'
            ? `<p class="hint" style="margin:10px 0 0">Lands before the bell, so it will be priced
               into the 8:30 CT open. Recompute the bracket off that open, not off tonight's estimate.</p>`
            : ''}` : '<p class="hint" style="margin:0 0 10px">No high-impact events left this week.</p>'}

      <table style="margin-top:14px">
        <thead><tr><th style="text-align:left">When</th><th style="text-align:left">Event</th>
          <th style="text-align:left">Impact</th><th>Session</th></tr></thead>
        <tbody>${cal.upcoming.map((e) => `<tr>
          <td>${until(e.epoch)} <span class="muted">(${e.ctTime ?? ct(e.etTime)} CT)</span></td>
          <td style="text-align:left">${e.title}</td>
          <td style="text-align:left" class="${e.impact === 'High' ? 'sig' : 'muted'}">${e.impact}</td>
          <td>${e.window.replace('-', ' ')}</td></tr>`).join('')}
        </tbody>
      </table>`;

  return `<div class="panel">
    <h2>Scheduled events</h2>
    <p class="hint">${cal.source} · ${cal.coverage}${
      cal.stale ? ` · <b>showing a cached copy from ${cal.ageMinutes} min ago</b> — ${cal.staleNote}` : ''}</p>
    ${body}
    <p class="hint" style="margin:12px 0 0">${cal.financialJuice}</p>
  </div>`;
}

/**
 * Is this setup worth trading, and by how much?
 *
 * Graded on the one thing the evidence actually supports: how much more range
 * this cohort produces than an ordinary session. Not on how many flags happen
 * to be lit — six chips lighting up is not six times the edge.
 */
function setupGrade(d) {
  const L = d.last, st = d.stats;
  const flags = [L.nr7, L.nr4, L.insideDay, L.twoBarNr20, L.nr20].filter((v) => v === true).length;

  if (!flags) {
    return { level: 'none', icon: '○', label: 'No setup',
      detail: 'No contraction pattern. This is an ordinary session — the ORB here is the baseline, not an edge.' };
  }

  const q = st?.available ? (st.current.insufficient ? st.nearestUsable : st.current) : null;
  const b = st?.baseline;
  if (!q || !b?.medianRangeMultiple) {
    return { level: 'unknown', icon: '?', label: 'Setup present, unquantified',
      detail: 'Contraction flags are lit but there is no usable base rate to size the edge.' };
  }

  const lift = q.medianRangeMultiple / b.medianRangeMultiple;
  const pctMore = Math.round((lift - 1) * 100);

  if (lift >= 1.3) {
    return { level: 'good', icon: '●', label: 'Tradable setup', lift,
      detail: `After ${q.label}, the next session's range runs about <b>${pctMore}% larger</b> than a typical session (${q.medianRangeMultiple.toFixed(2)}× vs ${b.medianRangeMultiple.toFixed(2)}×, n=${q.n}).` };
  }
  if (lift >= 1.12) {
    return { level: 'weak', icon: '◐', label: 'Marginal setup', lift,
      detail: `Only about ${pctMore}% more range than a typical session after ${q.label} — thin edge for the risk.` };
  }
  return { level: 'weak', icon: '○', label: 'Flags lit, no measurable edge', lift,
    detail: `${q.label} produces a range within ${Math.abs(pctMore)}% of an ordinary session. The pattern is present; the edge is not.` };
}

/** The exact orders, sized. Removes the arithmetic between reading and acting. */
function orderPlan(d) {
  const orb = d.orb;
  if (!orb?.available) return '';

  const stretch = d.nextStretch;
  const stopPts = 2 * stretch;                 // opposite bracket = Crabel's reverse point
  const riskPerContract = stopPts * MNQ_PT;
  const budgets = [250, 500, 1000];

  return `<div class="plan">
    <div class="plan-title">What you are actually doing</div>
    <ol class="plan-steps">
      <li><b>Go long if price trades above ${n1(orb.buyStop)}</b>, or
          <b>go short if it trades below ${n1(orb.sellStop)}</b>. Both orders wait; you take whichever
          the market reaches first${orb.live ? '' : ', recomputed off the 8:30 CT open'}.</li>
      <li><b>Once one triggers, cancel the other</b> — or leave it in place as your exit, which turns
          the pair into a stop-and-reverse. Those are two different strategies; pick one.</li>
      <li><b>Exit the loser at the opposite level.</b> That is
          <b>${n0(stopPts)} points against you</b> —
          <b>$${riskPerContract.toFixed(2)} per <span class="ctr">MNQ</span></b> contract
          <span class="muted">(${usdEmini(stopPts)} on the full-size E-mini)</span>.</li>
      <li><b>Close the position before the bell.</b> This is a one-session pattern; carrying it
          overnight throws away the premise it rests on.</li>
    </ol>
    <div class="plan-size">
      ${budgets.map((b) => `<div class="sz"><span class="szn">${Math.floor(b / riskPerContract)}</span>
        <span class="szl">MNQ @ $${b} risk</span></div>`).join('')}
    </div>
    <p class="hint" style="margin:10px 0 0"><b>Every dollar figure on this page is MNQ</b>
      ($${CONTRACT.pointValue.toFixed(2)}/point). Prices come from NQ=F, but the E-mini is 10× the size —
      on NQ this stop is ${usdEmini(stopPts)} and these contract counts would be wrong by a factor of ten.
      Sizes are <code>floor(budget ÷ risk)</code> only; they ignore your prop firm's daily loss limit
      and trailing drawdown. Size down from these, never up.</p>
  </div>`;
}

/**
 * Minutes until the next RTH open, or until the close if one is running.
 * Weekends are skipped; market holidays are NOT known here, so the label says
 * "next weekday open" rather than claiming the market will actually be open.
 */
function sessionClock(d) {
  const now = new Date();
  const et = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const mins = et.getHours() * 60 + et.getMinutes();
  const dow = et.getDay();
  const OPEN = 9 * 60 + 30, CLOSE = 16 * 60;

  // The countdowns below are zone-agnostic, but the wall clock is not: prefix
  // every state with the time it actually is in Houston, so nothing on the page
  // has to be mentally shifted.
  const stamp = `${hhmm(ctNowMinutes())} CT`;

  if (d?.meta?.sessionInProgress && mins >= OPEN && mins < CLOSE) {
    const left = CLOSE - mins;
    return { live: true, text: `${stamp} · ${Math.floor(left / 60)}h ${String(left % 60).padStart(2, '0')}m left in session` };
  }

  // Inside RTH but the feed has not produced an in-progress session yet — say so
  // rather than counting down to an open that has already happened.
  if (dow >= 1 && dow <= 5 && mins >= OPEN && mins < CLOSE) {
    return { live: false, text: `${stamp} · session open — awaiting data` };
  }

  let days = 0;
  if (dow === 0) days = 1;
  else if (dow === 6) days = 2;
  else if (mins >= CLOSE) days = dow === 5 ? 3 : 1;

  const delta = days === 0 ? OPEN - mins : days * 1440 - mins + OPEN;
  const m = Math.max(0, delta);
  const h = Math.floor(m / 60);
  return { live: false, text: `${stamp} · ` + (h >= 24 ? `opens in ${Math.floor(h / 24)}d ${h % 24}h` : `opens in ${h}h ${String(m % 60).padStart(2, '0')}m`) };
}

/**
 * Trade breakdown — the bracket read against options positioning.
 *
 * The useful question is not where the levels are but which way has room. A
 * breakout with 60 points to a gamma wall is a different trade from one with
 * 250 points of open ground, and that asymmetry is the whole panel.
 */
function tradeBreakdown(d) {
  const g = d.gamma;
  if (!g?.available) {
    return `<div class="panel"><h2>Trade breakdown</h2>
      <p class="hint" style="margin:0">Gamma levels unavailable — ${g?.reason ?? 'no data'}.
      The bracket read above still stands; only the positioning overlay is missing.</p></div>`;
  }

  const orb = d.orb, pj = d.projection;
  const side = (label, dir, air, pctProj, first, list, stop) => {
    const roomy = g.roomier === dir;
    return `<div class="side ${roomy ? 'roomy' : ''}">
      <div class="side-head">
        <span class="side-label">${label}</span>
        ${roomy ? '<span class="side-tag">more room</span>' : ''}
      </div>
      <div class="side-air">
        <span class="air-n">${air == null ? '—' : n0(air)}</span>
        <span class="air-u">pts clear air</span>
      </div>
      <div class="side-sub">${air == null ? 'no level within the projection'
        : `${pct(pctProj, 0)} of the ${n0(pj.median)}-pt projection, then <b>${first.names.join(' / ')}</b> at ${n1(first.value)}`}</div>
      <table class="side-tbl"><tbody>${list.slice(0, 5).map((l) => `<tr>
        <td>${n1(l.value)}</td>
        <td class="muted">${dir === 'long' ? '+' : '−'}${n0(Math.abs(l.value - stop))}</td>
        <td style="text-align:left">${l.names.join(' / ')}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  };

  const verdict = g.roomier === 'neither'
    ? 'Both sides run into positioning at a similar distance — the level map does not favour either direction.'
    : `<b>The ${g.roomier} side has materially more room.</b> ${
        g.roomier === 'long'
          ? `A break above ${n1(orb.buyStop)} has ${n0(g.airLong)} points before the first level; a break below ${n1(orb.sellStop)} meets one after only ${n0(g.airShort)}.`
          : `A break below ${n1(orb.sellStop)} has ${n0(g.airShort)} points before the first level; a break above ${n1(orb.buyStop)} meets one after only ${n0(g.airLong)}.`}`;

  return `<div class="panel">
    <h2>Trade breakdown — bracket against gamma positioning</h2>
    <p class="hint">${g.ticker} · ${g.levelCount} levels · computed ${g.dates.join(' and ')}${
      g.stale ? ` · <b>cached copy</b> (${g.staleReason})` : ''}</p>

    <p class="synth" style="margin:12px 0 16px">${verdict}</p>

    <div class="sides">
      ${side('Long break', 'long', g.airLong, g.airLongPctOfProjection, g.firstAboveBuy, g.above, orb.buyStop)}
      ${side('Short break', 'short', g.airShort, g.airShortPctOfProjection, g.firstBelowSell, g.below, orb.sellStop)}
    </div>

    <h3 style="font-size:12.5px;margin:20px 0 6px">Inside the bracket — met before either stop fires</h3>
    ${g.inside.length
      ? `<table><thead><tr><th style="text-align:left">Level</th><th>Price</th>
           <th>From sell stop</th><th>From buy stop</th></tr></thead>
         <tbody>${g.inside.map((l) => `<tr>
           <td style="text-align:left">${l.names.join(' / ')}</td>
           <td>${n1(l.value)}</td>
           <td class="muted">+${n0(l.value - orb.sellStop)}</td>
           <td class="muted">−${n0(orb.buyStop - l.value)}</td></tr>`).join('')}
         </tbody></table>
         <p class="hint" style="margin:8px 0 0">${g.inside.length} levels sit inside a
           ${n0(orb.buyStop - orb.sellStop)}-point bracket. Price transacts through these before either
           order triggers, so the bracket is not firing into clean space.</p>`
      : '<p class="hint" style="margin:0">Nothing between the stops — the bracket spans clear ground.</p>'}

    ${g.stale0dteCount ? `<div class="callout" style="margin-top:16px">
      <b>${g.stale0dteCount} levels are 0DTE from a prior session</b> and expire with the options that
      produced them. They are excluded from the price map and from the clear-air figures above, but they
      are the reason a wall you saw on Friday may simply not exist today. Re-pull after the open.</div>` : ''}
  </div>`;
}

/** Cohort vs baseline on one metric. Same hue; identity comes from the labels. */
function compareRow(label, value, baseline, format, scaleMax) {
  const w = (v) => Math.max(1.5, Math.min(100, (v / scaleMax) * 100));
  return `<div class="cmp">
    <div class="cmp-label">${label}</div>
    <div class="cmp-track">
      <div class="cmp-bar" style="width:${w(value)}%"></div>
      <div class="cmp-base" style="left:${w(baseline)}%" title="baseline ${format(baseline)}"></div>
    </div>
    <div class="cmp-val">${format(value)}<span class="cmp-vs">vs ${format(baseline)}</span></div>
  </div>`;
}

function statsPanel(st, source) {
  if (!st?.available) {
    return `<div class="panel"><h2>Base rates</h2><p class="hint" style="margin:0">Unavailable — ${st?.reason ?? 'no history'}</p></div>`;
  }

  const c = st.current, b = st.baseline, u = st.nearestUsable;

  // The cohort actually quoted for the headline: the current setup if it has a
  // sample, otherwise the nearest broader one, always named.
  const q = c.insufficient ? u : c;

  // Too few to quote a rate, but the individual outcomes are still evidence.
  const analogues = c.insufficient && c.observations?.length
    ? `<h3 style="font-size:12.5px;margin:16px 0 6px">Every occurrence of ${c.label} in this sample</h3>
       <table>
         <thead><tr><th style="text-align:left">Setup day</th><th>Setup range</th>
           <th>Next range</th><th>Multiple</th><th>Next close</th></tr></thead>
         <tbody>${c.observations.map((o) => `<tr>
           <td>${o.date}</td><td>${n0(o.setupRange)}</td><td>${n0(o.nextRange)}</td>
           <td>${o.multiple.toFixed(2)}×</td>
           <td>${o.nextUp ? 'up' : 'down'} ${n0(Math.abs(o.nextChange))}</td></tr>`).join('')}
         </tbody>
       </table>
       <p class="hint" style="margin:8px 0 0">${
         c.observations.filter((o) => o.multiple > 1).length} of ${c.observations.length} expanded.
         Read these as anecdotes, not a rate — four observations cannot support a percentage.</p>`
    : '';

  const head = c.insufficient
    ? `<div class="callout">
         <b>${c.label}</b> has only <b>${c.n}</b> occurrence${c.n === 1 ? '' : 's'} in this sample —
         too few to quote a rate (minimum ${c.minSample}). That rarity is itself the finding.
         ${u ? `Aggregate figures below are for the broader <b>${u.label}</b> cohort instead.` : 'No broader cohort has a sample either.'}
       </div>${analogues}`
    : '';

  const opening = st.openingRates?.length
    ? `<h3 style="font-size:12.5px;margin:20px 0 4px">Crabel's second axis — where the session opens</h3>
       <p class="hint" style="margin:0 0 8px">Same patterns, different expectancy depending on where the
         open lands relative to the prior session. Outcome is that same session, so this becomes live at 8:30 CT.</p>
       <table>
         <thead><tr><th style="text-align:left">Open</th><th>n</th><th>Closes up</th>
           <th>&gt; 20d avg range</th><th>Median range</th></tr></thead>
         <tbody>${st.openingRates.map((o) => `<tr>
           <td>${o.label}${o.insufficient ? ' <span class="muted" style="font-weight:400">(thin)</span>' : ''}</td>
           <td>${o.n}</td>
           <td>${o.upCloseSignificant
                 ? `<b class="sig">${pct(o.upCloseRate)}</b> <span class="muted" style="font-size:11px">${o.upCloseZ > 0 ? '+' : ''}${o.upCloseZ.toFixed(1)}σ</span>`
                 : `<span class="muted">${pct(o.upCloseRate)}</span>`}</td>
           <td>${o.expansionSignificant
                 ? `<b class="sig">${pct(o.expansionRate)}</b> <span class="muted" style="font-size:11px">${o.expansionZ > 0 ? '+' : ''}${o.expansionZ.toFixed(1)}σ</span>`
                 : `<span class="muted">${pct(o.expansionRate)}</span>`}</td>
           <td>${o.medianRangeVs20d.toFixed(2)}×</td></tr>`).join('')}
         </tbody>
       </table>
       <p class="hint" style="margin:8px 0 0">Everything greyed is inside two standard errors of its own
         baseline — the pooled ${pct(st.openingRates[0].pooledUpCloseRate)} up-close drift for direction,
         the pooled ${pct(st.openingRates[0].pooledExpansionRate)} for expansion. Direction is judged
         against that drift rather than against 50%, so a setup gets no credit for the market simply rising.</p>`
    : '';

  // Bars rather than three more number tiles: the whole question is "how does
  // this setup differ from an ordinary session", which is a comparison, and a
  // comparison reads faster as length than as digits.
  const x2 = (v) => v.toFixed(2) + '×';
  const cmp = q ? `
    <div class="cmp-block">
      <div class="cmp-head">After <b>${q.label}</b> <span class="muted">n=${q.n}</span>
        <span class="cmp-key">marker = all sessions</span></div>
      ${compareRow('Next-session range', q.medianRangeMultiple, b.medianRangeMultiple, x2,
                   Math.max(q.p75RangeMultiple, b.medianRangeMultiple * 1.6))}
      ${compareRow('Beats 20-session avg range', q.expansionRate, b.expansionRate, (v) => pct(v), 1)}
      ${compareRow('Closes up', q.upCloseRate, b.upCloseRate, (v) => pct(v), 1)}
      <p class="hint" style="margin:10px 0 0">${
        directionDiffers(q, b.upCloseRate)
          ? 'The direction figure clears two standard errors of the baseline drift — weak, but real.'
          : `The direction figure is within two standard errors of the ${pct(b.upCloseRate)} baseline drift — no edge.`}
        Middle half of outcomes ran ${x2(q.p25RangeMultiple)}–${x2(q.p75RangeMultiple)}.</p>
    </div>` : '';

  const rows = st.cohorts.map((x) => x.insufficient
    ? `<tr><td>${x.label}</td><td>${x.n}</td>
         <td>${x.medianRangeMultiple != null ? x.medianRangeMultiple.toFixed(2) + '×' : '—'}</td>
         <td colspan="2" class="muted" style="text-align:left">sample too small for rates</td></tr>`
    : `<tr><td>${x.label}</td><td>${x.n}</td><td>${x.medianRangeMultiple.toFixed(2)}×</td>
         <td>${directionDiffers(x, b.upCloseRate)
               ? `<b class="sig">${pct(x.upCloseRate)}</b>` : `<span class="muted">${pct(x.upCloseRate)}</span>`}</td>
         <td>${pct(x.expansionRate)}</td></tr>`).join('');

  return `<div class="panel">
    <h2>Base rates — what happened the session after</h2>
    <p class="hint">${st.source} · ${st.sampleSessions.toLocaleString()} sessions · ${st.from} → ${st.to}
      ${st.proxyNote ? `<br>${st.proxyNote}` : ''}</p>
    ${head}${cmp}

    <details style="margin-top:16px">
      <summary>Every setup compared</summary>
      <table style="margin-top:12px">
        <thead><tr><th style="text-align:left">Setup</th><th>n</th><th>Median range ×</th><th>Up close</th><th>&gt; 20d avg</th></tr></thead>
        <tbody>${rows}
          <tr class="baseline-row"><td>All sessions</td><td>${b.n}</td><td>${b.medianRangeMultiple.toFixed(2)}×</td>
              <td>${pct(b.upCloseRate)}</td><td>${pct(b.expansionRate)}</td></tr>
